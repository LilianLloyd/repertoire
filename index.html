range et un Bloody Mary, découvre ses liens rompus ; Pierrot, poète qui ne sait plus que mimer ; Édouard, un brouillon couvert de ratures, qui ne dit que « Hmmm ». Face au public, ils comprennent qu’on les a convoqués sans texte. Personne n’arrive à parler sous la lumière du monologue, alors ils partent à la chasse aux mots : Ninie appelle l’Inspiration au téléphone, Eva interroge Édouard sous la lampe, Pierrot raconte comment son autrice lui a acheté une vie en soldes au supermarché de l’imaginaire, puis tente un slogan de meeting. Chacun essaie de jouer sa propre scène, l’histoire d’amour, le journal télévisé, la femme trompée, tandis qu’ils s’estompent peu à peu, faute d’une histoire qui les lie.", "personnages": ["Pierrot", "Debbie", "Eva", "Ninie", "Édouard"], "ages": ["libre"]}, {"id": "le-conte-de-camille", "titre": "Le Conte de Camille", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 90, "annee": 2002, "comediens": 4, "f": 3, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "4 (3F/1H)", "resume_court": "Camille invente, pour l’enfant qu’elle garde, des contes de princesse qui racontent surtout sa propre vie amoureuse. Le babysitting comme diversion, et comme confession.", "resume": "Dans la chambre du petit Paul, Camille, fleuriste d’une vingtaine d’années passées, lit à voix de miel l’histoire de la princesse Lanécia et du bel Arthur, qu’elle invente au fur et à mesure. Paul est le fils de Sandrine, cadre pressée qui ne supporte pas Franck, le compagnon de Camille. Franck a enfin un travail stable depuis deux mois, mais il n’est « pas prêt » à emménager, rentre à une heure du matin en jean troué et oublie les dîners prévus. Camille attend, comme Pénélope. À la boutique, Annie, l’assistante maladroite, a vu une femme se jeter sous un RER, et la boutique ne vend plus que des couronnes. C’est ce soir-là que Sandrine vient dire à Camille ce qu’elle a vu de Franck. Camille cesse de travailler, reste sous la couette, scotche les têtes de ses roses rouges pour les faire tenir, puis demande à Franck s’il aime « cette fille ». Sandrine, elle, convoque Franck à une terrasse de café pour le remercier, avec une ironie tranchante. Et le conte de la princesse, lu à Paul, suit pas à pas la vie de Camille.", "personnages": ["Les personnages ont entre 20 et 30 ans"], "edite": true, "ages": ["j"], "editeur": "Éclats d’encre"}, {"id": "le-dernier-mot", "titre": "Le Dernier Mot", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 75, "annee": 2022, "comediens": 6, "f": 3, "h": 3, "libre": 0, "roles": null, "modulable": false, "distribution": "6 (3F/3H)", "resume_court": "Avant de sombrer dans le coma, le patriarche des Dumont lâche un aveu à sa femme : il l’a trompée. Sans autre explication.", "resume": "La terrasse d’une grande maison de famille, le 24 décembre. Guy Dumont est dans le coma, et avant d’y sombrer il a trouvé la force de dire à Suzie, sa femme depuis quarante ans : « Pardonne-moi, chérie, je t’ai trompée. » Autour du lit se retrouvent les enfants : Lisa, qui tente de tenir la maison debout et n’arrive jamais à allumer sa cigarette ; Luc, divorcé, criblé de dettes, qui parle à son épaule et fait de l’humour de croque-mort ; Noémie, comédienne sous le nom de Noémie Fénix, lunettes noires et répliques toutes prêtes ; Adrien, le styliste qui n’était pas revenu depuis dix ans et que tout le monde croit homo ; et Benoît, le mari de Noémie, chirurgien esthétique qui estime déjà la maison. Suzie, gavée de calmants, fait l’explication de texte de la dernière phrase de son mari, fouille son portable et se souvient des cahiers qu’elle cachait pour écrire. Pendant que le père tarde à mourir, les aveux s’enchaînent : chacun a son secret, et chacun le lâche au pire moment.", "personnages": ["Suzie, 65-75 ans", "Lisa, 40-50 ans", "Luc, 40-50 ans", "Noémie, 35-45 ans", "Adrien, 35-45 ans", "Benoît, le mari de Noémie, 40-50 ans"], "ages": ["a", "s"]}, {"id": "le-klan", "titre": "Le Klan", "famille": "Drame & thriller", "genre": "Thriller", "duree": 90, "annee": 2016, "comediens": 4, "f": 2, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "4 (2F/2H)", "resume_court": "Louisiane, 1984. Mark Duke, garagiste et membre du Ku Klux Klan, avoue le meurtre d’un jeune juif et ne demande qu’une chose : que ça aille vite. Son frère Tony, ténor du barreau new-yorkais qu’il n’a pas vu depuis dix ans, débarque pour le défendre contre son gré, avec Kate, une avocate débutante.", "resume": "Winnsboro, Louisiane, 1984. Ariel Sachs, conseiller bancaire et père de deux enfants, a été poignardé puis pendu. Mark Duke, garagiste tatoué et « faucon de nuit » des Guerriers Bayou, avoue tout dès le premier parloir. Kate Winterbottom a trois mois de barreau, un chat nommé Elliot et un revolver dans le sac ; elle est commise d’office. Betty, la femme de Mark, appelle à la rescousse le seul qui puisse lui éviter la chaise électrique : Tony, le grand frère parti à New York, avocat des causes perdues, carte de visite à liseré d’or et cocaïne en poche. Les deux frères se détestent depuis la mort en prison d’un père qui leur a légué sa haine. Entre une caution de cent mille dollars, une mère que Mark fleurit tous les dimanches et un téléphone mis sur écoute, Kate et Tony comprennent qu’un coupable aussi pressé d’être condamné cache forcément quelque chose. Des années plus tard, c’est Kate qui raconte l’affaire à des étudiants en droit.", "personnages": ["Mark Duke, 35 ans", "Tony Duke, son frère, la quarantaine", "Betty Duke, la femme de Mark, 33 ans", "Kate Winterbottom, environ 25 ans"], "ages": ["a"]}, {"id": "les-horizons-brises", "titre": "Les Horizons Brisés", "famille": "Drame & thriller", "genre": "Drame", "duree": 90, "annee": 2009, "comediens": 5, "f": 2, "h": 3, "libre": 0, "roles": null, "modulable": false, "distribution": "5 (2F/3H)", "resume_court": "Portbail, novembre 1974. Paul, écrivain à succès atteint d’une maladie orpheline, quitte l’hôpital pour s’installer face à la mer chez son frère jumeau. Ses amis débarquent de Paris : entre Americanos et vieux comptes, chacun fait semblant que tout va bien.", "resume": "Portbail, novembre 1974, une maison face à la mer encore pleine de cartons. Paul, écrivain à succès, a quitté l’hôpital où l’on voulait l’étudier comme un cas rare : une sclérose concentrique, maladie orpheline qui lui ronge le cerveau. Il s’installe chez son frère jumeau Jacques, qui fuit les courses caché sous la table avec deux Americanos et hurle sur sa secrétaire au téléphone, et chez Marie-France, sa femme, qui cache une brochure pour reprendre sa thèse. Michel, l’ami beatnik, débarque de Paris le nez sous pansement avec Jeanne, qu’il a fallu faire boire pour la ramener : personne ne lui a dit que Paul était malade. Jeanne veut le renvoyer à l’hôpital, s’étonne qu’il refuse la morphine et le soupçonne de vouloir se tuer. Entre les repas, les cigarettes en cachette sur la plage et un saladier d’Americano, les vieux comptes remontent : Marie-France réclame sa vie de femme diplômée et Jeanne et Michel rouvrent leur histoire. Paul enregistre ses pensées sur un vieux magnétophone et feint d’aller bien dès qu’on l’approche.", "personnages": ["Paul et Jacques, jumeaux, 40-45 ans", "Marie-France, la femme de Jacques, 35-45 ans", "Michel, 40-45 ans", "Jeanne, 30-40 ans"], "edite": true, "ages": ["a"], "editeur": "La Librairie Théâtrale"}, {"id": "les-males-heureux", "titre": "Les Mâles Heureux", "famille": "Comédie", "genre": "Comédie", "duree": 90, "annee": 2002, "comediens": 3, "f": 0, "h": 3, "libre": 0, "roles": null, "modulable": false, "distribution": "3 (3H)", "resume_court": "Alain, François et Philippe, copains depuis le collège, s’installent en coloc en jurant que ce sera pour la vie. Un an plus tard, l’écrivain sous anxiolytiques n’a pas écrit une ligne, le chanteur court les auditions et le seul salarié paie le loyer pour trois. Et l’ex d’Alain annonce son mariage sur le répondeur.", "resume": "Trois chaises, un chewing-gum, un yo-yo : Alain, François et Philippe, copains depuis le collège, attendent la réponse d’un propriétaire. C’est oui, ils enregistrent le répondeur en chœur et chantent qu’ils seront colocataires pour la vie. Un an plus tard, les placards sont délimités et la guerre des Miel Pops est déclarée. Alain, sous Zoloft et Séropram, veut vivre des droits d’un roman qu’il n’a pas commencé, au point de se planter son stylo dans la main ; François parle verlan, dort avec sa guitare et court les auditions ; Philippe, bientôt 33 ans et le seul à avoir un boulot fixe, paie le loyer seul depuis trois mois, drague sur Internet et vide son sac chez le psy, entre les coups de fil d’une mère catholique pressée de le marier. Tout se dérègle quand Céline, l’ex d’Alain, laisse un message sur le répondeur : elle se marie dans deux mois et veut le voir à l’église. Pendant ce temps, l’agence exige qu’ils partent faute d’avoir payé les charges, et la bande se déchire autour du loyer.", "personnages": ["François, 30-35 ans", "Philippe, bientôt 33 ans", "Alain, 30-35 ans"], "edite": true, "ages": ["a"], "editeur": "Éclats d’encre"}, {"id": "les-pieds-dans-le-vide", "titre": "Les pieds dans le vide", "famille": "Comédie douce-amère", "genre": "Comédie douce-amère", "duree": 75, "annee": 2009, "comediens": 2, "f": 1, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "2 (1F/1H)", "resume_court": "Le même soir de réveillon, Antoine tente de se pendre et Laura d’avaler des médicaments : leurs deux suicides ratés les font atterrir l’un chez l’autre.", "resume": "Un soir de 31 décembre, Antoine débarque à l’improviste chez Laura. Ils ont beau être voisins, ils ne se sont jamais adressé la parole et rien ne semble a priori les rapprocher. Sauf que ce soir, ils ont décidé de se suicider au même moment, chacun dans son coin, mais le destin en a décidé autrement. Antoine voulait se pendre : le crochet auquel tenait la corde a rendu l’âme, et il est passé à travers son plancher pour atterrir chez sa voisine du dessous. Laura, donc, qui, elle, buvait de l’alcool et avalait des médicaments. Sous l’effet de la surprise, elle vomit tout. Tout les oppose. Mais ils vont se rendre compte, au cours de ce réveillon inoubliable, qu’ils ont bien plus de points communs qu’ils ne l’imaginent…", "personnages": ["Laura, la trentaine", "Antoine, la petite quarantaine"], "ages": ["a"]}, {"id": "les-preuves-d-amour", "titre": "Les preuves d'amour", "famille": "Seul-en-scène", "genre": "Seul-en-scène", "duree": 75, "annee": 2008, "comediens": 1, "f": 0, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "1 (1H)", "resume_court": "Un homme tout juste largué par Lily se raconte la nuit où il a tout perdu, entre facéties de cabaret et petites vengeances imaginaires.", "resume": "Un théâtre parisien, la nuit. Jimmy, chroniqueur jazz dans une radio, vient de se faire mettre à la porte par Lily, après plus de deux ans de vie commune, pour une histoire de « conscience » à laquelle il ne comprend rien. Un ami propriétaire de la salle l’héberge sur scène : duvet, coussin, valise, et chaque soir des spectateurs dans sa chambre. Il rejoue tout. Le palier et la porte blindée, la voisine Madame Fontaine en tenue légère, le sac de fringues dans le caniveau, la mère de Lily qui sabre le champagne et lui tend le magazine « Casse-toi ! » avec sa photo en couverture. Puis il remonte le fil : Lily croisée au coin d’une rue, le taxi de José Collignon, le videur de la boîte du Carrousel, le premier restaurant, l’appartement envahi de ballons peints, le poisson rouge mort à côté du grille-pain. Jimmy tient tous les rôles, passe du stand-up à la chanson et interpelle la salle, pendant que la lune, dehors, observe.", "personnages": ["Jimmy, la trentaine"], "ages": ["j"]}, {"id": "les-yeux-fermes", "titre": "Les yeux fermés", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 70, "annee": 2026, "comediens": 1, "f": 0, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "1 (1H), qui joue tous les personnages", "resume_court": "Antoine, 42 ans, loser attachant, garde pour une semaine l’appartement de Marc, son meilleur ami depuis trente ans, et sa chatte Nina. Il tombe sur quelque chose qu’il n’aurait jamais dû voir. Peut-on être quelqu’un de bien quand on a les yeux fermés ?", "resume": "", "personnages": ["Antoine, 42 ans (un seul comédien joue tous les rôles : Nina la chatte, Marc, Kevin, trois « mecs »)", "Nathalie et Marianne, projetées en vidéo, la quarantaine", "Dex, l’algorithme : une voix, sans âge"], "ages": ["a"], "indispo": true}, {"id": "m-en-fous-la-mort", "titre": "M'en fous la Mort !", "famille": "Fable & conte", "genre": "Fable", "duree": 75, "annee": 2006, "comediens": 4, "f": 1, "h": 1, "libre": 2, "roles": null, "modulable": false, "distribution": "4 : La Mort, un garçon, une fille, un enfant (2 rôles au choix H/F)", "resume_court": "Un soir, la Mort tombe en panne de voiture et se retrouve coincée dans un grenier avec trois orphelins qui la connaissent très bien. Pour passer le temps, ils lui font jouer les textes de leur père, retrouvés dans une vieille malle.", "resume": "Un an jour pour jour après la mort de leur père, auteur de théâtre, trois enfants montent au grenier forcer la malle où il rangeait ses textes. Ils tombent sur la Mort en personne. Elle porte une cape Armani, elle est allergique à la poussière, sa tête de Delco vient de lâcher à deux pas et elle a pris le planning de l’année dernière. En attendant la dépanneuse, ce sont eux, pour une fois, qui décident de jouer avec elle. La faux sert de pied-de-biche, la malle s’ouvre, et la Mort se retrouve distribuée dans les rôles de papa, de maman, et de tous ceux qu’ils ont été avant de se rencontrer : deux inconnus qui tombent amoureux dans un rêve, des insomniaques, une fille qui fait du stop sur l’autoroute de la vie. Les enfants mettent en scène. La Mort a le trac, pleure à chaque scène (c’est la poussière, dit-elle) et découvre qu’elle n’a pas beaucoup de registre.", "personnages": ["La Mort, homme ou femme, sans âge", "Lui et Elle, jumeaux d’environ 8 ans", "L’autre, garçon ou fille, environ 10 ans"], "ages": ["j"]}, {"id": "meme-pas-en-reves", "titre": "Même pas en rêves", "famille": "Drame & thriller", "genre": "Drame", "duree": 90, "annee": 2009, "comediens": 4, "f": 2, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "4 (2F/2H)", "resume_court": "Léandre, Gabrielle, Denis et Viviane, une bande de trentenaires en déshérence, se répètent que demain sera meilleur qu’aujourd’hui sans y croire tout à fait.", "resume": "Quatre amis, Gabrielle, Denis, Léandre et Viviane, se débattent contre une existence qu’ils aiment se compliquer.", "personnages": ["Léandre", "Denis", "Gabrielle", "Viviane", "Tous les quatre ont la trentaine"], "ages": ["a"]}, {"id": "nationale-666-the-highway-to-elle", "titre": "Nationale 666 (The Highway to Elle)", "famille": "Autres formes", "genre": "Road trip", "duree": 90, "annee": 2002, "comediens": 3, "f": 3, "h": 0, "libre": 0, "roles": null, "modulable": false, "distribution": "3 (3F)", "resume_court": "Devant l’autel, Sophie prend la fuite, poussée par sa mauvaise conscience, Louise, et rattrapée par la bonne, Angélique. Direction New York… jusqu’à la panne, à Granville.", "resume": "Devant l’autel, Sophie Lanorme, poussée par sa (mauvaise) conscience Louise Cyphère, décide de s’enfuir de son mariage avec Paul. Commence alors une longue cavale pour Sophie et Louise, rejointes par Angélique Amoureuse, l’autre (bonne) conscience. Direction New York… mais la voiture tombe en panne à Granville. Elles s’en contenteront. Louise propose alors à Angélique de lui laisser le « contrôle » de Sophie, pour lui montrer ce qu’est la vraie vie. Pendant deux jours, Sophie découvre tous les plaisirs qu’Angélique lui interdisait : fumer, boire, danser, jouir de la vie, et jouir tout court. D’un commissariat à une plage où l’on se lamente, d’une boîte de nuit peuplée d’âmes en perdition à une autre, Sophie se découvre elle-même.", "personnages": ["Sophie, entre 25 et 30 ans", "Louise et Angélique, ses doubles, 25-30 ans"], "edite": true, "ages": ["j"], "editeur": "Éclats d’encre"}, {"id": "ne-cessez-pas-de-rire", "titre": "Ne cessez pas de rire !", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 80, "annee": 2013, "comediens": 4, "f": 4, "h": 0, "libre": 0, "roles": null, "modulable": false, "distribution": "4 (4F)", "resume_court": "Un 31 décembre, sur une plage du Pays basque, quatre amies de trente ans se retrouvent pour dire adieu à la cinquième, Charlotte, qui a choisi de ne pas être là. Son absence va révéler des mensonges et mettre leur amitié à rude épreuve.", "resume": "Un 31 décembre, sur une plage du Pays basque. On pourrait fêter la nouvelle année, mais Claire, Marie, Audrey et Val ne sont pas d’humeur. Elles ne comprennent pas le choix de Charlotte de ne pas être avec elles. Son absence va les envahir, révéler des mensonges et mettre à rude épreuve leur amitié… Ce sont quatre femmes dans les contradictions de leur temps, partagées entre l’instantanéité de la communication et le désir de durer dans leurs relations. Elles ont chacune des combats à mener, dans la maternité, dans leurs envies de femmes épanouies, et rêvent toutes d’un peu de simplicité et de vérité. Cette nuit, où elles doivent dire un dernier adieu à Charlotte, va les diviser et les révéler à elles-mêmes, dans les rires, dans les pleurs, mais avant tout ensemble.", "personnages": ["Les quatre femmes ont une trentaine d’années"], "ages": ["a"]}, {"id": "on-a-tout-mis-dans-le-decor", "titre": "(On a tout mis) Dans le décor", "famille": "Comédie", "genre": "Commedia dell'arte", "duree": 75, "annee": 2012, "comediens": 9, "f": 4, "h": 5, "libre": 0, "roles": null, "modulable": false, "distribution": "9 comédiens en scène (4F/5H) + une voix en coulisses ; Pantalon et Matamore joués par le même", "resume_court": "Venise, un maire corrompu démissionne : Pantalon, sous la pression de sa femme avide de pouvoir, se lance dans la course contre le fanfaron Matamore, pendant qu’Arlequin et Polichinelle changent de maître au gré du vent.", "resume": "Venise. Le maire véreux vient de tomber pour une sombre histoire de corruption, et des élections anticipées sont organisées dans l’urgence. Pantalon, trop occupé à compter les sous de sa flamboyante entreprise de recyclage des eaux usées, se moque bien de tout cela. Mais Madame Pantalon, elle, voit dans la démission du maire l’occasion rêvée d’accroître leur puissance : elle veut devenir première dame. Son mari refuse ? Elle demande l’aide du Dottore, son vieil amant, pour l’y pousser, avec un plan machiavélique : une fois Pantalon élu, l’empoisonner avec une décoction du Dottore et se proclamer première femme maire de Venise ! Pendant ce temps débarque en ville Matamore, Espagnol fantasque et mythomane, avec qui Pantalon a un vieux compte à régler. Polichinelle, toujours prêt à servir qui le nourrit, se range à ses côtés ; Arlequin, maltraité par son maître, se rebelle, pendant que sa Colombine succombe au charme de Brighella… Commence une guerre sans merci, tous les coups bas permis, pour la possession de la ville.", "personnages": ["Arlequin", "Colombine", "Pantalon", "Madame Pantalon", "Il Dottore", "Polichinelle", "Brighella", "Matamore", "Et les comédiens eux-mêmes, à visage découvert", "Tous les âges"], "ages": ["libre"]}, {"id": "on-s-ennuiera-plus-tard", "titre": "On s'ennuiera plus tard", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 70, "annee": 2023, "comediens": 3, "f": 1, "h": 2, "libre": 0, "roles": 8, "modulable": false, "distribution": "8 rôles pour 3 comédiens (1F/2H)", "resume_court": "Chaque soir, Clément dresse le couvert d’Odette et lui fait la conversation, même si elle est morte depuis quelques années. Mais aujourd’hui, les souvenirs débordent sur le présent, et leurs doubles de vingt ans s’invitent à table.", "resume": "Clément n’est plus très jeune, et c’est une pudeur de dire qu’il n’est pas vieux. Sa vie, il l’a passée sans faire trop de bruit, en la dédiant à son seul amour, Odette, disparue il y a quelques années. Malgré son décès, elle l’accompagne tous les soirs à son dîner : il lui met son assiette et ils discutent longuement. Le monde dehors, il n’en a cure. C’est à peine si leur fille, Mathilde, appelle pour prendre des nouvelles. Qu’importe, il n’en veut à personne : il attend patiemment son tour pour rejoindre Odette, pour « s’évader », comme il dit. Ses journées sont rythmées par la même routine, avec les visites de Zoé, son attendrissante voisine, et d’Antoine, son jeune médecin attentionné. Mais aujourd’hui, sans qu’il comprenne bien pourquoi, des souvenirs viennent s’entrechoquer avec la réalité, le passé tutoie le présent… Les premiers signes de la maladie, sûrement. Lui se laisse prendre à ces incursions étranges, qui vont l’emmener vers une résolution inattendue…", "personnages": ["Clément, 75-85 ans (et Clément jeune, 25-35 ans)", "Mathilde, sa fille, 45-55 ans", "Zoé, 20-30 ans", "Antoine, 30-35 ans"], "ages": ["j", "a", "s"]}, {"id": "one-moi-show", "titre": "One Moi Show", "famille": "Seul-en-scène", "genre": "Seul-en-scène à sketches", "duree": 75, "annee": 2004, "comediens": 1, "f": 0, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "1 (1H)", "resume_court": "Recueil de sketches en solo (2001-2004) où l’auteur se met en scène en type pas drôle, pas gentil, pas net, entre célibat revendiqué, bébé refusé et provocations assumées.", "resume": "Un homme seul en scène, qui prévient d’entrée qu’il n’est pas drôle et passe le spectacle à essayer de le prouver. Chaque sketch part d’une situation ordinaire et la pousse jusqu’au mauvais goût. Dans « Putain, 5 ans », il convoque papa et maman pour leur présenter officiellement son célibat, chaussettes au lit, cookies et raviolis, zéro Saint-Valentin à payer. Dans « Un bébé, ou ça ? », il a 25 ans, sa mère lui achète encore ses jeans, et Sophie veut un enfant tout de suite : il propose de commencer par un hamster. Henry, « serial killer », entre avec un long couteau et explique qu’il ne tue que ce qui l’énerve, à commencer par les agents de la SNCF un jour de grève. « Québec » s’en prend aux chanteurs québécois qui beuglent le top 50, Corneille compris. Et « Toujours pas drôle » s’ouvre sur une annonce de sécurité proposant sac à vomi et Tranxène, avant que le comique décide que son créneau, ce sera « mec méchant » et retourne le rire contre la salle.", "personnages": ["Un seul comédien, 25-40 ans, dans tous les rôles"], "ages": ["j"]}, {"id": "pile-et-face", "titre": "Pile et Face", "famille": "Comédie romantique", "genre": "Comédie romantique", "duree": 70, "annee": 2006, "comediens": 2, "f": 1, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "2 (1F/1H)", "resume_court": "Incapable de trancher quoi que ce soit sans l’aide d’une pièce de monnaie héritée de son père, Will s’apprête enfin à avouer son amour à Natacha, le soir même où elle vient lui annoncer son propre mariage.", "resume": "Will est un homme bien sympathique. Sa plus grande qualité, c’est Natacha, sa meilleure amie fantasque. Son seul défaut : être incapable de faire un choix, et s’en remettre pour chaque décision à sa précieuse pièce de monnaie. Et ce soir, il doit lui avouer son amour. Seul hic : la pétillante Natacha vient lui annoncer qu’elle a rencontré un homme et qu’elle veut l’épouser. Alors oui, pour l’un comme pour l’autre, rien ne se passe comme prévu !", "personnages": ["Will et Natacha, la trentaine"], "ages": ["a"]}, {"id": "portrait-avec-retouches-la-panthere", "titre": "Portrait avec retouches", "famille": "Autres formes", "genre": "Biographie (Françoise Giroud)", "duree": 90, "annee": 2026, "comediens": 6, "f": 3, "h": 3, "libre": 0, "roles": 19, "modulable": false, "distribution": "19 rôles pour 6 comédiens (3F/3H)", "resume_court": "Mars 1977. Accusée par un sénateur de porter illégalement la médaille de la Résistance, Françoise Giroud a une semaine pour répondre, en direct à la télévision. Sur le divan de Lacan, elle rouvre enfin le seul dossier qu’elle n’a jamais instruit : le sien.", "resume": "", "personnages": ["Françoise Giroud, de 20 à 61 ans", "Rôles partagés : sa mère, Jean-Jacques, Lacan, Giscard, Simone Veil, Caroline, Djénane, une militante, des conseillers, un sénateur, un journaliste…, de 30 à 75 ans"], "ages": ["a", "s"], "indispo": true}, {"id": "presque-elle", "titre": "Presque Elle", "famille": "Drame & thriller", "genre": "Drame d'anticipation", "duree": 90, "annee": 2024, "comediens": 7, "f": 3, "h": 4, "libre": 0, "roles": null, "modulable": false, "distribution": "7 (3F/4H) + une IA en voix", "resume_court": "Dans un futur incertain, l’apiculteur veuf Gabriel voit resurgir Jodie, sa femme morte depuis dix ans, bien vivante et intacte de mémoire : miracle pour les uns, manipulation scientifique pour les autres.", "resume": "Dans un futur incertain, en France, Gabriel, veuf depuis dix ans, vit en apiculteur isolé et lutte pour préserver son métier face à une nature malmenée par l’homme. Son seul lien humain est Francesco, un prêtre défroqué qui veille sur sa santé fragile. Sa principale compagnie : Lucy, son enceinte connectée, qu’il s’efforce de rendre aussi humaine que possible. Alors qu’il se réfugie de plus en plus dans ses souvenirs de Jodie, sa femme disparue, celle-ci réapparaît soudain, bien vivante, avec tous ses souvenirs. Bouleversé, Gabriel doit affronter un deuil qu’il pensait avoir surmonté. Mira, la mère de Jodie, embrasse ce retour comme un miracle ; Francesco y voit un peu de divin qu’il faudrait baptiser. Mais la réalité est plus complexe : Dan et Kali, le meilleur ami de Gabriel et la sœur de Jodie, sont les véritables instigateurs de ce retour. Anciens collègues dans un centre de recherche, Dan a poursuivi les travaux que Gabriel avait abandonnés à la mort de Jodie. Et ce retour-là porte en lui des implications susceptibles de bouleverser l’humanité.", "personnages": ["Gabriel, 50 ans", "Jodie, 35 ans", "Dan, 50 ans", "Kali, 45 ans", "Francesco, 55 ans", "Mira, 70 ans", "Elie, 50 ans"], "ages": ["a", "s"]}, {"id": "puisque-vous-partez-en-voyage", "titre": "Puisque vous partez en voyage", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 90, "annee": 2024, "comediens": 4, "f": 2, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "4 (2F/2H)", "resume_court": "Deux ans que Jacques, 75 ans, fait la lecture à sa femme sur sa tombe, Françoise Hardy en fond sonore. Un dimanche, une inconnue déplie sa chaise à côté de la sienne, chante le refrain et salue la défunte d’un « Bonjour, Maman ». Jacques, qui avait prévu de couper l’électricité la semaine suivante, va devoir revoir son planning.", "resume": "Deux ans que Rose est morte, et Jacques, ancien professeur de fac, vient plusieurs fois par semaine lui lire des romans sur sa tombe, radiocassette compris. Chez lui, il résilie ses abonnements un par un. Un dimanche, Nina s’installe à côté de lui, chante la chanson préférée de Rose et l’appelle « Maman ». Ancienne patiente de Rose, veuve depuis six mois, végétarienne, sans gluten et sans filtre, elle a la colère facile et le chagrin encore plus. Jacques finit par la ramasser, puis par l’héberger. Ses enfants s’affolent. Simon fait carrière dans l’entourage du président et change de parti comme de cravate. Lucie est revenue vivre chez papa avec la cave de son futur ex-mari. Ils voient débarquer la « cinglée du cimetière » et flairent la captatrice d’héritage. Jacques, ravi, leur annonce le mariage. Reste que Nina en sait sur Rose un peu plus qu’une simple patiente.", "personnages": ["Jacques, 75 ans", "Nina, 35-45 ans", "Simon, 35 ans", "Lucie, 45 ans"], "ages": ["a", "s"]}, {"id": "rayon-grand-deballage", "titre": "Rayon grand déballage", "famille": "Comédie", "genre": "Comédie (co-écrite avec Olivier Fournel)", "duree": 75, "annee": 2009, "comediens": 2, "f": 2, "h": 0, "libre": 0, "roles": null, "modulable": false, "distribution": "2 comédiennes (2F)", "resume_court": "Une nuit, enfermées dans un grand magasin. Élise, patronne claustrophobe noyée dans le whisky, et Sandrine, mère de famille venue là exprès, en pèlerinage, qui la gifle par réflexe. Jusqu’à l’ouverture, entre le rayon chaussures et le rayon literie, elles se déballent tout.", "resume": "Une nuit, dans un grand magasin de neuf cents mètres carrés, portes fermées jusqu’au lendemain matin. Élise, patronne qui fait du « pas très gentille » une ligne de son CV, a la tête dans un seau et une bouteille de whisky dans le sang quand Sandrine surgit dans son dos et lui colle une claque, par réflexe : son oncologue lui a appris à ne pas se laisser abattre. Sandrine, mère de deux enfants, s’est fait enfermer exprès, pour une sorte de pèlerinage ; Élise, elle, est claustrophobe et veut sortir tout de suite. La pharmacie du deuxième étage est fermée, les matelas de la NASA attendent au rayon literie, et le répertoire de deux cents contacts d’Élise ne répond plus : l’ami voisin vit à Hong Kong depuis quatre ans. Entre le rayon cosmétique, la recette mijotée à feu doux et les chaussures jugées « moches, très moches », les deux femmes s’accrochent puis se déballent : un mari cocufieur, un avortement évité de justesse, un chat malade qu’on ne caresse plus, un horoscope qui pousse au whisky.", "personnages": ["Sandrine, 35-45 ans", "Élise, 40-50 ans"], "ages": ["a"]}, {"id": "reves-party", "titre": "Rêves Party", "famille": "Autres formes", "genre": "Pièce à tableaux pour adolescents", "duree": 75, "annee": 2017, "comediens": null, "f": null, "h": null, "libre": 0, "roles": null, "modulable": true, "distribution": "Troupe d’adolescents, modulable", "resume_court": "Dans une soirée d’adolescents où l’on danse, fume et se cherche, Mathilde et Léandre se croisent au hasard d’une cigarette qui refuse de s’allumer.", "resume": "Chez Alice, un soir de Nouvel An. On danse, on boit, on fait des selfies. Dès qu’un couple prend la parole, les autres deviennent le Chœur, qui commente, se moque et souffle les mots qu’on n’ose pas dire. Mathilde tend du feu à Léandre, mais sa cigarette refuse de s’allumer depuis trois jours : son ange gardien souffle la flamme. Léandre, lui, a la garde de Denis, un copain largué qui s’enferme aux toilettes avec du white spirit, renifle la colle qu’Alice lui a donnée et finit la main collée à sa clope. Autour d’eux, Emma et son « regard con », Sandrine qui ne sait pas « comment dire » face au baratin de Julien, Paul qui range son ex dans une boîte le soir de son anniversaire, Tom qui lâche à Nella un mot doux qu’elle refuse de laisser repartir, Lise qui veut qu’on l’aime tout de suite. Une coupure de courant plonge la fête dans le noir, et les mains se trompent de cuisse.", "personnages": ["Paul, 16 ans", "Léandre, Mathilde, Tom, Emma, Denis, Sandrine, Nella, Alice, Julie, Lise, Julien : des adolescents, de 15 à 18 ans", "Un chœur"], "ages": ["j"]}, {"id": "si-tu-me-quittes-je-viens-avec-toi", "titre": "Si tu me quittes, je viens avec toi", "famille": "Saynètes & recueils", "genre": "Comédie à saynètes", "duree": 80, "annee": 2014, "comediens": null, "f": null, "h": null, "libre": 0, "roles": null, "modulable": true, "distribution": "Distribution modulable, écrite pour 6 comédiens", "resume_court": "Comédie à sketches qui passe en revue toutes les manières de rompre (avec son homme, sa mère ou ses propres espoirs) jouées par une troupe qui échange les rôles, hommes et femmes compris.", "resume": "Une comédie loufoque qui passe en revue mille manières de se quitter en bons termes… ou pas ! Qu’on ait besoin de se séparer de son homme, de son amant ou de son envahissante mère, il y a une saynète pour ça. Une troupe, une foule de personnages, tous pris dans des situations de rupture : amoureuses, bien sûr, mais aussi avec soi-même, avec sa mère ou avec ses espoirs. Bienvenue dans un monde absurde : le vôtre.", "personnages": ["Personnages de tous âges (saynètes)"], "ages": ["libre"]}, {"id": "spoiler", "titre": "Spoiler", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 80, "annee": 2026, "comediens": 4, "f": 2, "h": 2, "libre": 0, "roles": 7, "modulable": false, "distribution": "7 rôles (4F/3H) pour 4 comédiens (2F/2H), l'oncle en projection", "resume_court": "Depuis ses huit ans, Antoine vit flanqué de Gérard, un spoiler invisible qui lui révèle toujours la fin, si bien qu’il n’a jamais rien commencé. Jusqu’au jour où Lina, venue déclarer une urne funéraire égarée, rend Gérard muet pour la première fois.", "resume": "", "personnages": ["Antoine, 40 ans", "Lina, 35-40 ans", "Sam, la trentaine", "Maud, 30-40 ans", "Gérard, sans âge", "Une cliente"], "ages": ["a"], "indispo": true}, {"id": "suivant-les-pointilles", "titre": "Suivant les pointillés", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 90, "annee": 2020, "comediens": 4, "f": 2, "h": 2, "libre": 0, "roles": 17, "modulable": false, "distribution": "17 rôles pour 4 comédiens (2F/2H)", "resume_court": "À Harlem, Clive, boxeur sur le déclin sorti de prison, et Rosie, tout juste acquittée d’avoir tué son mari violent, tentent de se réparer l’un l’autre sans rien se dire de leur passé.", "resume": "New York. Clive, la quarantaine, sort de prison après neuf ans pour un braquage. Pour survivre et payer la pension de son ex-femme et de sa fille, il a remis les gants de boxe, lui qui fut un « prospect » à son époque. Au même moment, Rosie attend le verdict du procès où elle doit répondre d’avoir tiré sur le mari qui la battait depuis des années. Elle est reconnue non coupable. Une nouvelle vie s’ouvre à elle, mais la rééducation sera longue avant de retomber amoureuse, d’accorder sa confiance. Une ligue de défense des femmes, le « Mouvement », veut faire d’elle l’icône du combat ; elle refuse, décidée à mener le sien : revenir à la vie. Un soir, elle rencontre Clive, qui fait des burgers dans un boui-boui. Le coup de foudre est rapide, malgré elle, malgré lui. Elle lui cache tout de sa vie d’avant ; il reste soigneusement mystérieux sur son passé de braqueur et de boxeur. Mais le mensonge rôde de chaque côté. Dans une ville étouffante, entourés de personnages hauts en couleur, ils vont tenter de se réparer l’un l’autre et de se donner une chance, envers et contre tout.", "personnages": ["Clive et Rosie, la quarantaine (la trentaine pour Rosie dans une version antérieure)"], "ages": ["a"]}, {"id": "suivez-mon-ame", "titre": "Suivez mon âme", "famille": "Seul-en-scène", "genre": "Seul-en-scène", "duree": 60, "annee": 2017, "comediens": 1, "f": 0, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "1 (1H)", "resume_court": "Antoine, bientôt cinquante ans, dort encore dans son lit d’adolescent. Flanqué de Cyrano, son ami imaginaire, il raconte sa vie à une seule personne du public, et décide enfin d’enlever les petites roues du vélo.", "resume": "Antoine va avoir cinquante ans et dort toujours dans son lit d’adolescent, chez ses parents. Photographe, célibataire, affublé du nez paternel qui entre dans les pièces avant lui, il a toujours roulé avec des petites roues à l’arrière du vélo. Né en 1967 alors que son père pied-noir attendait une fille, il se raconte à une seule personne du public, toujours la même, flanqué de Cyrano, son ami imaginaire. Jusqu’au jour où il décide d’enlever une petite roue : un billet pour l’Amazonie, un chaman, une tasse d’ayahuasca, et une grande aventure pour retrouver les morceaux de lui qui manquent.", "personnages": ["Antoine, bientôt 50 ans"], "ages": ["a"]}, {"id": "sur-l-echelle-de-glasgow", "titre": "Sur l'échelle de Glasgow", "famille": "Drame & thriller", "genre": "Drame poétique", "duree": 90, "annee": 2015, "comediens": 6, "f": 3, "h": 2, "libre": 1, "roles": null, "modulable": false, "distribution": "6 (3F/2H + Calvin, asexué)", "resume_court": "Théo se réveille sous un abri, sous la pluie, dans un coma partagé avec d’autres. Sam et Calvin lui expliquent la règle : 11 sur l’échelle de Glasgow, et pour remonter, il faut aimer et se faire aimer. Et La Mort rôde, plan à la main.", "resume": "Un abri sous la pluie, en novembre, à 27h66. Théo débarque, paniqué : son dernier souvenir est un crissement de pneus, puis des voix qui disent « trauma crânien » et « on intube ». Sam et Calvin, un clown, lui expliquent qu’il n’est pas mort : il est dans un coma partagé, noté 11 sur l’échelle de Glasgow, et pour remonter, il n’y a qu’un moyen, aimer et se faire aimer. Autour de lui gravitent Aimy, qui veut tomber amoureuse ce soir sinon elle s’écroule, Charlie, qui perd la mémoire à chaque cycle et avec qui tout recommence, et La Mort, faux et plan à la main, qui court après un patient à 6 sur 15 qui passe son temps à la semer. Pendant que Théo drague, compte jusqu’à mille à l’envers et en anglais, rate ses déclarations, chacun cherche qui aide qui à remonter.", "personnages": ["Théo, 20-30 ans", "Sam, 30-40 ans", "Aimy, 25-35 ans", "Charlie, 30-40 ans", "Calvin, sans âge", "La Mort, sans âge"], "ages": ["j", "a"]}, {"id": "terrienne", "titre": "Terrienne", "famille": "Seul-en-scène", "genre": "Seule-en-scène", "duree": 70, "annee": 2009, "comediens": 1, "f": 1, "h": 0, "libre": 0, "roles": null, "modulable": false, "distribution": "1 (1F)", "resume_court": "Au lendemain de l’enterrement de son père, Anna, sculptrice de trente-cinq ans, ne parvient pas à pleurer. Entre une mère caustique, un frère qui pleure pour deux, un compagnon patient et le fantôme narquois du défunt, elle découvre des centaines de lettres jamais envoyées à un certain « M. Weber » et part frapper à sa porte.", "resume": "Un cimetière, un enterrement. Anna, trente-cinq ans, sculptrice qui ne vend plus, enterre son père, mort à soixante ans avec des poumons couleur d’asphalte, et gratte en elle sans trouver une larme. Seule en scène, elle fait exister ceux qui l’entourent : Franck, son compagnon depuis cinq ans, qui lui tend soupe et yaourt ; Dany, sa mère, partie depuis dix ans, qui refuse qu’on l’appelle « maman » et traite ses sculptures de pâte à modeler ; Guillaume, le petit frère de vingt-cinq ans qui pleure pour un escargot écrasé. Et le Père lui-même, qui revient en fantôme narquois dans un coin de sa tête. Dans un paquet ficelé de fil de fer, Anna découvre des centaines de lettres jamais envoyées, toutes adressées à « M. Weber, rue Davout ». Elle se brouille avec Franck et part chercher le vieux portail vert, pendant qu’un pianiste invisible joue dans sa tête.", "personnages": ["Anna, 35 ans, seule en scène, qui fait aussi exister Maude, Dany, son père, Franck et Guillaume"], "ages": ["a"]}, {"id": "this-is-not-america", "titre": "This is not America", "famille": "Drame & thriller", "genre": "Drame", "duree": 90, "annee": 2018, "comediens": 4, "f": 2, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "4 (2F/2H)", "resume_court": "Travis, vétéran hanté par des guerres sans début ni armistice, se retrouve dans le parloir délabré d’un commissariat face à Gabby.", "resume": "Juin 2018, dans le parloir délabré d’un commissariat, sous un néon qui clignote. Gabby, agente qui dévore les chips confisquées à ses gosses, interroge Travis, vétéran d’Afghanistan aux côtes cassées, qui la connaît déjà sous un autre visage. Quelques jours plus tôt, à Rocksprings, Texas, près de la frontière, Travis tient un vieux bar avec Bradley, son frère cadet, nationaliste qui planque un fusil sous le comptoir. Summer, une petite trentaine, y chante seule au micro puis y trouve un job ; son mari Tahar, musulman qui chantait l’hymne plus fort que tout le monde, a été abattu par un « déséquilibré », et le carré musulman où il repose a été saccagé le soir de l’élection de Trump. Une tornade s’abat sur le bar et y enferme les quatre, avec Gabby, femme en voiture immatriculée dans le Michigan qui se dit psychiatre et s’est perdue. Coupure de courant, bougies, groupe électrogène à court d’essence : les langues se délient autour du journal de Tommy, le fils de Travis, pendant que Bradley sort son pistolet contre une camionnette de passeurs arrêtée devant la porte.", "personnages": ["Travis, 45-50 ans", "Bradley, son frère, 35-40 ans", "Summer, 30 ans", "Gabby, 45-50 ans"], "ages": ["j", "a"]}, {"id": "tout-pareil-ou-presque", "titre": "Tout pareil, ou presque", "famille": "Autres formes", "genre": "Road movie", "duree": 80, "annee": 2020, "comediens": 4, "f": 1, "h": 3, "libre": 0, "roles": null, "modulable": false, "distribution": "4 (1F/3H), la comédienne multi-rôles", "resume_court": "Trente ans après se l’être promis, Jérôme, Rémi et Lucas rejouent, dans les mêmes conditions, un voyage du Pays basque à la pointe de la Hague, sauf que la géographie a changé, et eux aussi.", "resume": "Jérôme, son frère Lucas et leur ami Rémi, la petite soixantaine, embarquent tous les trois pour un voyage qu’ils se sont promis de faire il y a trente ans, du Pays basque à la pointe de la Hague. Ils doivent refaire exactement le même trajet, dans les mêmes conditions, en respectant les mêmes arrêts et le même moyen de locomotion ! Seul problème : en trente ans, non seulement la géographie a changé, mais eux aussi. C’est parti pour une grande aventure parsemée d’embûches et de rencontres improbables, sans compter les vieilles rancœurs et les non-dits accumulés depuis trente ans…", "personnages": ["Lucas, Rémi et Jérôme, la petite soixantaine", "Tous les rôles féminins joués par une même comédienne, de 30 à 60 ans"], "ages": ["s"]}, {"id": "tripalium", "titre": "Tripalium", "famille": "Comédie", "genre": "Comédie sociale", "duree": 90, "annee": 2011, "comediens": 8, "f": 4, "h": 4, "libre": 0, "roles": null, "modulable": false, "distribution": "8 (4F/4H)", "resume_court": "Une équipe de télé filme la résistance improbable des salariés d’une PME menacée de délocalisation, entre lutte sociale et amours de bureau maladroites.", "resume": "Lundi, 7 h 30, chez « Atout pique », petite filiale de banlieue parisienne d’un grand groupe. Depuis une semaine, l’équipe du magazine télé « En immersion », menée par la journaliste Florence Rossi, filme le quotidien du bureau. Isidore, qui vit chez sa maman, offre une rose à Stella et récolte deux râteaux dans la matinée. Sarah, la déléguée syndicale, laisse entendre une liaison avec Benoît, le patron qui voit son métier comme un sacerdoce. Clémentine attend son CDI. Puis Jeff, « adjoint au directeur » formé chez les paras sur son CIF, annonce la nouvelle à la place de Benoît, parti avec son attaché-case : le groupe a été racheté par un consortium chinois, et la filiale est délocalisée à Timisoara. Personne n’est gardé. Les salariés votent la séquestration de Benoît, mains attachées dans le dos, découvrent que la centrale syndicale a donné à Sarah de faux numéros, et misent sur la présentatrice du 20 h. Et les amours de bureau se consomment en vitesse près de la machine à café.", "personnages": ["Benoît, 50 ans", "Clémentine, 47 ans", "Philippe, 40-50 ans", "Stella, 25-35 ans", "Sarah, 40-50 ans", "Jeff, 30-40 ans", "Isidore, 30-40 ans", "Florence, 35-45 ans"], "ages": ["j", "a"]}, {"id": "trois-petits-points-de-fuite-histoire-d-ames-ii", "titre": "Trois petits points de fuite (Histoire d'âmes II)", "famille": "Saynètes & recueils", "genre": "Comédie à saynètes", "duree": 90, "annee": 2009, "comediens": null, "f": null, "h": null, "libre": 0, "roles": null, "modulable": true, "distribution": "Modulable", "resume_court": "Un immeuble, un mois, une porte par scène : derrière chacune, un couple se quitte, se retient ou se rate. Entre deux ruptures, Emmy, qui refuse son nom de famille et laisse toutes ses phrases en suspens, suit dans les couloirs le voisin à qui elle n’ose pas dire bonjour.", "resume": "Un immeuble, un mois, une porte par scène. Au troisième étage, devant l’ascenseur, Emmy se présente : pas Émilie, pas Emma, et surtout pas son nom de famille, celui d’un père qui n’a jamais voulu d’elle. Elle ne veut rien, sauf le voisin qui lui dit bonjour et à qui elle n’arrive pas à répondre à voix haute. Un garçon l’a un jour baptisée Emmy Troispetitspoints, parce que ses phrases restent en suspens. Entre ses apparitions, les portes s’ouvrent sur des couples qui se défont. Au rez-de-chaussée, Vanessa quitte Denis sur un « prends soin de toi » qu’il ne supporte pas. Au cinquième, Vincent tape contre une porte qui ne s’ouvre pas, puis revient valise à la main. Au premier, Armand interroge son caleçon pendant que Laly attend. Au neuvième, Patrick attend son compagnon rentré trop tard ; au deuxième, Carole se déshabille devant Léo et fixe ses conditions. Pendant ce temps, Emmy se décide à suivre le voisin dans les couloirs, étage après étage.", "personnages": ["Emmy, la vingtaine", "Les voisins de l’immeuble (Vanessa, Denis, Vincent, Armand…) : de 25 à 60 ans"], "ages": ["j", "a"]}, {"id": "un-cadavre-exquis", "titre": "Un cadavre exquis", "famille": "Comédie douce-amère", "genre": "Comédie douce-amère", "duree": 100, "annee": 2007, "comediens": 7, "f": 3, "h": 4, "libre": 0, "roles": null, "modulable": false, "distribution": "7 (3F/4H)", "resume_court": "En Angleterre, Armando, metteur en scène génial à ses propres yeux, monte le spectacle de sa vie sur la mort, avec un atout que personne n’a jamais osé : Andrew, malade en phase terminale, engagé pour mourir en scène le soir de la première. Mais la troupe s’attache à lui, et Andrew se remet à vivre.", "resume": "En Angleterre, Armando, grand metteur en scène reconnu dans le monde entier pour ses spectacles… bien à lui, décide de monter une pièce dont le sujet est la mort. Mais pas n’importe laquelle : il a recruté pour l’occasion Andrew, un malade en phase terminale, qui s’est engagé à mourir le soir de la représentation, afin que son corps soit exposé aux yeux de tous… Mais la vie, par le biais de l’amour et des quiproquos, reprend toujours le dessus, et Andrew va se sentir revivre au contact de la troupe d’Armando. Acceptera-t-il sa destinée ?", "personnages": ["Armando, 50-60 ans", "Andrew, 30-40 ans", "Emmy, 20-30 ans", "Lyneth, 30-40 ans", "Tommy, 20-30 ans", "Lena, 25-35 ans", "Peter-James, 40-50 ans"], "ages": ["a"]}, {"id": "un-choeur-qui-bat", "titre": "Un Chœur qui Bat", "famille": "Comédie", "genre": "Comédie", "duree": 100, "annee": 2024, "comediens": null, "f": null, "h": null, "libre": 0, "roles": null, "modulable": true, "distribution": "Modulable, jusqu'à 12 comédiens ; les rôles masculins du chœur peuvent être tenus par des femmes", "resume_court": "Un chœur antique, façon tragédie grecque, commente et orchestre en direct la vie amoureuse d’Alizé, jeune femme de 25 ans qui n’a encore jamais embrassé personne.", "resume": "Au bord du lac Léman, un bureau et sa machine à café. Alizé, vingt-cinq ans, qui refait les calculs des résultats trimestriels et fait corps avec les murs, n’a encore jamais embrassé personne : son cœur bat pour les femmes, et aucune ne le remarque. Problème : un chœur antique en tuniques blanches, Thésée, Orphée, Icare, Médée, Hélène, Électre, Pénélope et Io, perché sur une estrade, raconte sa vie en vers et à la troisième personne. Quand Victoire traverse le bureau comme un podium et l’appelle Annie puis Anna, Alizé s’effondre ; Debbie lui hurle ses urgences, Sam la surprend en train de répéter dans les toilettes des hommes, et le dîner de famille chante la gloire de la sœur parfaite et de son mari parfait. Le chœur se déchire : Hélène et Électre réclament la parité face à Thésée, chef depuis vingt-cinq ans, et Io lui prend son bâton pour qu’ils interviennent dans la vie d’Alizé, au risque de devenir mortels. Ils remplissent en douce un questionnaire de rencontre à sa place, et le téléphone se met à sonner « Top Flash ».", "personnages": ["Alizé, 25 ans", "Debbie, 35-45 ans", "Sam, 25-35 ans", "Victoire, 25-35 ans", "Le chœur (8) : Thésée, le chef de chœur, Orphée, Icare, Médée, Hélène, Électre, Pénélope, Io, de 20 à 60 ans", "Rôles secondaires : la mère, le père, la sœur, le mari, des passants, des collègues"], "ages": ["j", "a"]}, {"id": "un-drole-d-heritage-pepe-est-parti", "titre": "Un drôle d'héritage", "famille": "Comédie", "genre": "Comédie", "duree": 80, "annee": 2015, "comediens": 6, "f": 4, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "6 (4F/2H)", "resume_court": "En vidant la maison de Pépé, fraîchement décédé, Rose tombe sur un uniforme allemand et des lettres de délation. Entre un frère schizophrène, une mère toxique, des tantes gratinées et Floyd, pour qui elle a un gros béguin, ses douze travaux commencent.", "resume": "La famille de Rose est, comme qui dirait, dysfonctionnelle. Entre un frère, Tom, complètement schizophrène, une mère toxique et des tantes gratinées, la pauvre jeune femme ne s’en sort pas. Et quand il s’agit de vider la maison du grand-père fraîchement décédé, rien ne s’arrange. Surtout lorsqu’on découvre, dans les affaires du gentil pépé, un uniforme allemand et des lettres de délation… Quelle est donc la vérité qu’il a emportée avec lui ? Rose va devoir démêler tout cela, tout en rencontrant un jeune homme, Floyd, pour qui elle a un gros béguin… Bref, ses douze travaux commencent.", "personnages": ["Floyd, 25-30 ans", "Rose, 30 ans", "Suzanne, 55 ans", "Aline, 45-50 ans", "Tom, 20-25 ans", "Sarah, 45 ans"], "ages": ["j", "a"]}, {"id": "un-gramme-de-lumiere", "titre": "Un gramme de lumière", "famille": "Drame & thriller", "genre": "Drame, thriller", "duree": 75, "annee": 2012, "comediens": 2, "f": 0, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "2 (2H)", "resume_court": "Au parloir d’une prison, Alfred, jeune avocat commis d’office, cherche à comprendre pourquoi Harvey Pierce a tenté de s’évader à quelques jours de sa libération.", "resume": "Alfred est un jeune avocat commis d’office pour s’occuper du cas de Harvey Pierce. Ce dernier, condamné à vingt ans pour meurtre, a tenté de s’évader à quelques jours de sa remise en liberté. Ce geste, aussi stupide qu’il puisse paraître, interroge Alfred. Au fil de leurs rendez-vous mouvementés, ces deux hommes que tout oppose vont nouer une amitié teintée de crainte et de respect… Mais le jeu de la manipulation n’est jamais loin : qui tire les ficelles ?", "personnages": ["Harvey, 45-50 ans (adaptable à l’âge du comédien)", "Alfred, 27 ans"], "ages": ["j", "a"]}, {"id": "un-souffle-au-coeur", "titre": "Un souffle au cœur", "famille": "Comédie douce-amère", "genre": "Comédie douce-amère", "duree": 80, "annee": 2006, "comediens": 2, "f": 1, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "2 (1F/1H)", "resume_court": "Entre le fromage et le dessert, Lilas annonce à Samuel qu’ils vont se quitter.", "resume": "Un salon, un plateau de fromages, un rôti de veau déjà avalé. Samuel raconte comment il a humilié Dominique au bureau quand Lilas, sa femme depuis six ans, lui annonce : « On va se quitter. » Il croit à une audition, elle est comédienne ; elle précise qu’elle ne part pas pour un autre, juste que leur couple est tombé en panne à Corbeil, et qu’il remarque qu’elle a déplacé son coffret de Bowie mais pas qu’elle sort de chez le coiffeur. En alternance, sept ans plus tôt, à un mariage où l’on sert de l’agneau, Lilas aborde un inconnu qui soupire à la table derrière elle : Samuel, tout juste divorcé, qu’elle baptise Machin avant de le suivre jusqu’à sa voiture et son canapé. D’une époque à l’autre, les scènes se répondent : la première nuit, Porte de Bagnolet et « Le beau Danube bleu », contre le retour éméché, le trajet muet vers la psy où Samuel invente à Lilas un traumatisme d’enfance à base de Barbie, puis les vingt-sept jours qu’il compte en bâtons sur le mur quand elle s’installe chez ses parents à lui.", "personnages": ["Lilas, 40-50 ans", "Samuel, 45-50 ans"], "edite": true, "ages": ["a"], "editeur": "Éclats d’encre"}, {"id": "une-corde-avec-un-noeud-au-bout", "titre": "Une corde avec un nœud au bout", "famille": "Comédie douce-amère", "genre": "Comédie douce-amère", "duree": 105, "annee": 1999, "comediens": 5, "f": 2, "h": 3, "libre": 0, "roles": null, "modulable": false, "distribution": "5 (2F/3H)", "resume_court": "Léandre a choisi la corde pour ce soir, mais Thomas, Denis, Viviane et Laureen s’invitent l’un après l’autre, chacun avec sa propre urgence à décharger. Toute la nuit y passe.", "resume": "Un samedi soir sur Terre. À Paris ou ailleurs, qu’importe. Un appartement qui ressemble à tous les autres, à ceci près qu’au beau milieu du salon trône une corde avec un nœud au bout. Léandre, pas loin de la trentaine, se prépare à s’y balancer. Mais vouloir se suicider un samedi soir relève de l’exploit quand on a des amis envahissants. Tour à tour débarquent Thomas, trompé par sa Sandrine ; Denis, collectionneur de râteaux ; Viviane, heureuse de vivre en apparence ; et Laureen, mise à la porte par son Raphaël. Tous viennent s’épancher sur leur meilleur ami, leur bouée de sauvetage, sans voir que cette corde est faite pour se pendre, et non pour décorer. La nuit sera longue : Laureen et Thomas règlent leurs comptes, Denis espère briser l’écho de sa solitude, Viviane voit sa morale catholique voler en éclats, et la vieille histoire entre Laureen et Léandre tente de refaire surface.", "personnages": ["Léandre, pas loin de la trentaine", "Thomas, Denis, Viviane et Laureen, ses amis, 25-30 ans"], "ages": ["j"]}, {"id": "une-fin-heureuse", "titre": "Une fin heureuse", "famille": "Drame & thriller", "genre": "Drame", "duree": 100, "annee": 2009, "comediens": 3, "f": 2, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "3 (2F/1H)", "resume_court": "Il pleut. Romain vole de vieilles voitures et fuit un portrait-robot. Abigaïl, romancière, rate tous ses suicides. Jeanne perd la vue au bord de la mer. Un matin, sur un quai de métro, un cadre en costume grille la priorité à Abigaïl sous la rame et lui laisse sa main sur les genoux.", "resume": "Il pleut, et trois voix se présentent. Romain ne vole que de vieilles voitures, jamais de neuves. Il traîne derrière lui une adolescente retrouvée noyée au lendemain d’une nuit sur la plage, et un portrait-robot qui lui ressemble. Abigaïl, romancière au sourire de façade, rate tous ses suicides : défenestrée sur un camion de matelas, carburateur bouché à cent mètres du mur. Sur un quai de métro, un cadre en costume lui grille la priorité sous la rame et lui laisse sur les cuisses sa main et son attaché-case. Dedans, une adresse et la photo d’une fiancée. Jeanne vit chez sa mère au bord de la mer, perd la vue un peu plus chaque jour et ressasse l’homme marié qui l’a quittée. Quand Romain force la portière d’Abigaïl, elle lui tend les clés et monte côté passager. La main voyage sur la plage arrière, direction la mer, où quelqu’un attend encore quelqu’un.", "personnages": ["Romain, 30-40 ans", "Abigaïl, 30-40 ans", "Jeanne, 30-40 ans"], "ages": ["j", "a"]}, {"id": "une-histoire-de-frangins", "titre": "Une histoire de frangins", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 90, "annee": 2009, "comediens": 2, "f": 0, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "2 (2H)", "resume_court": "Lucas revient du Brésil pour l’enterrement de son frère Matt. Mais Matt est vivant : il a fabriqué la lettre de décès pour le faire revenir, quinze ans après sa fuite. Devant la tombe de leur mère, les deux frères se cognent, puis règlent leurs comptes : un père à double vie, une fiancée volée, une mère partie trop tôt. Jusqu’à ce que Lucas lâche qu’il a un cancer.", "resume": "Un cimetière de village, devant la tombe de leur mère. Lucas et Matt, deux frères qui approchent de la quarantaine, sont en sang : ils viennent de se battre. Lucas, patron d’un laboratoire pharmaceutique au Brésil, a traversé l’Atlantique après avoir reçu une lettre de notaire annonçant la mort de Matt. La lettre était un faux : Matt, devenu kiné, l’a cherché pendant douze ans et a fini par le retrouver sous le nom de jeune fille de leur mère. Quinze ans que Lucas a disparu, sans jeter une poignée de terre sur le cercueil. Entre le décompte des coups échangés, au nom d’un pacte de sang signé à dix ans, les vieux comptes remontent : le père et ses dix-huit ans de double vie, la demi-sœur ramenée un jour à la maison, la mère morte de chagrin et de Jack Daniel’s, la fiancée de Matt qui, à trois mois du mariage, couchait avec son témoin. Matt a tout porté seul, Lucas rend coup pour coup. Puis Lucas lâche qu’il a un cancer, et refuse qu’on en fasse des caisses.", "personnages": ["Lucas et Matt, la quarantaine ou s’en rapprochant"], "ages": ["a"]}, {"id": "une-poussiere-dans-l-oeil", "titre": "Une poussière dans l'œil", "famille": "Comédie douce-amère", "genre": "Comédie douce-amère", "duree": 80, "annee": 2005, "comediens": 4, "f": 2, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "4 (2F/2H)", "resume_court": "Pierre, la cinquantaine passée, romancier de gare dans l’ombre d’un père écrivain célèbre, réveille Marie à trois heures du matin pour savoir pourquoi elle le trompe. Elle ne le trompe pas. Entre un éditeur qui censure ses scènes d’amour, une main gauche qui écrit toute seule et l’arrivée de son demi-frère et de sa femme, l’appartement devient un champ de bataille.", "resume": "Trois heures du matin, un grand appartement décoré par Marie, avec un Bleu de Klein au-dessus du lit et, dans la bibliothèque, entre les livres du père, l’urne de la mère. Pierre, la cinquantaine passée, auteur à succès de romans de gare, rallume la lumière et demande à Marie, sa compagne depuis cinq ans : « Pourquoi tu me trompes ? » Elle ne le trompe pas. Il en fait un plan de bataille en chapitres. Son éditeur Alex lui refuse que David couche avec Jenny avant la page cinq, sa main gauche se met à écrire des phrases qu’il ne reconnaît pas, et la voisine du dessus massacre ses gammes au piano. Là-dessus débarquent, pour cause de dégât des eaux, Dominique, le demi-frère cadet qui a perdu ses trois boulots et salue l’urne d’un « t’aurais pas forci, maman ? », et Charlotte, sa femme, qui n’en peut plus. Pierre déchire les livres de son père, scotche sa main droite à sa cuisse et soupçonne tout le monde, pendant que la maison se remplit de malentendus.", "personnages": ["Pierre, 55-60 ans", "Marie, sa compagne, dans les quarante ans", "Dominique, son demi-frère cadet, la cinquantaine", "Charlotte, sa femme, quarante ans ou presque"], "edite": true, "ages": ["a", "s"], "editeur": "Éclats d’encre"}, {"id": "une-tres-legere-suspension", "titre": "Une très légère suspension", "famille": "Seul-en-scène", "genre": "Seul-en-scène", "duree": 60, "annee": 2024, "comediens": 1, "f": 0, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "1 (1H)", "resume_court": "Un soir, en haut de son escabeau, Étienne veut en finir, mais sa cravate est trop longue et aucun briquet ne marche. Une inconnue qui fume chez lui sans rien dire le pousse, de faux départ en faux départ, à revisiter un père taiseux, ses infidélités et le premier soir d’un amour perdu.", "resume": "Un appartement semé d’escabeaux et de cadres brisés. Étienne, costume noir, se tient en haut d’un escabeau, une cravate si longue qu’elle remonte jusqu’aux cintres : il veut sauter, mais aucun briquet ne marche et chaque saut le repose sur ses deux pieds. Chez lui a surgi une inconnue en robe échancrée, qui se sert son whisky, fume une cigarette allumée on ne sait comment et ne répond que par des phrases tirées d’un livre. Entre deux comptes à rebours, Étienne rouvre ses tiroirs : le père pied-noir, « mètre cube » de colère rentrée qui ne finissait aucune phrase, à commencer par « à 3, si t’as pas fini ta soupe… » ; ses années de « Kasparov de l’infidélité » ; le Saint-Joseph blanc du premier soir avec celle qui a épuisé sa réserve de pardons ; la lettre d’adieu à Mme Da Costa, la concierge ; la corde offerte par un voisin bricoleur, « fabrication allemande » ; la boîte vide des petits cachets. Il plaide contre lui-même, boxe l’engagement comme un champion de l’esquive, et cherche d’où viennent les citations de l’inconnue.", "personnages": ["Étienne, 45-55 ans, seul en scène"], "ages": ["a"]}, {"id": "viens-on-s-en-fout", "titre": "Viens, on s'en fout !", "famille": "Comédie romantique", "genre": "Comédie romantique", "duree": 70, "annee": 2015, "comediens": 3, "f": 2, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "3 (2F/1H)", "resume_court": "Dolly raconte, en observatrice amusée, la romance hésitante de Leslie et Tristan.", "resume": "On dit que le battement d’aile d’un papillon peut provoquer un séisme à l’autre bout de la planète. Ce matin-là, précisément celui-là, ce sont des avions qui sont tombés du ciel à New York. De l’autre côté de l’Atlantique, en France, c’est le moment où se rencontrent Tristan et Leslie. Tous les deux viennent de quitter leur boulot avec pertes et fracas. Et les voilà sur un banc, avec une seule chose à faire en regardant le ciel : s’aimer, et vite, et fort. Toute leur histoire est narrée par un personnage espiègle, qui recueille leurs angoisses et leurs espoirs : Dolly. Précise et bienveillante, elle va garder bien des secrets, jusqu’à la fin…", "personnages": ["Leslie et Tristan, la trentaine ou la jeune quarantaine", "Dolly, plus jeune"], "ages": ["j", "a"]}, {"id": "vous-en-reprendrez-bien-une-tranche", "titre": "Vous en reprendrez bien une tranche ?", "famille": "Saynètes & recueils", "genre": "Comédie à saynètes", "duree": 100, "annee": 2007, "comediens": null, "f": null, "h": null, "libre": 0, "roles": null, "modulable": true, "distribution": "Modulable", "resume_court": "Un Auteur monte sur scène et recoud son propre spectacle sous nos yeux   $('stats').innerHTML=STATS.map(s=>`<button type="button" class="stat" data-k="${s.k}" aria-pressed="${S.stat===s.k}"><b>${pieces.filter(s.test).length}</b>${s.label}</button>`).join('');
  const list=filtered();
  $('count').innerHTML=list.length===pieces.length?`<b>${pieces.length}</b> pièces`:`<b>${list.length}</b> sur ${pieces.length} pièces`;
  $('exportSel').hidden=!(S.dl&&window.jspdf)||!list.length;
  $('exportSel').textContent=list.length===pieces.length?'Télécharger le catalogue en PDF':'Télécharger cette sélection en PDF';
  $('list').innerHTML=list.length?list.map(p=>`<li class="row" tabindex="0" data-id="${esc(p.id)}">
      <div class="t">${esc(p.titre)}${p.edite?`<span class="badge">${p.editeur?'Éditée chez '+esc(p.editeur):'Éditée'}</span>`:''}${p.indispo?'<span class="badge-indispo">Actuellement non disponible pour la création</span>':''}</div>
      <div class="cast"><div class="pips" aria-label="${p.f??'?'} femmes, ${p.h??'?'} hommes">${pips(p)}</div><div class="n">${esc(castLabel(p))}</div></div>
      <div class="meta"><span>${esc(p.genre||p.famille)}</span>${p.duree?`<span>${fmtDur(p.duree)}</span>`:''}${p.annee?`<span>${p.annee}</span>`:''}</div>
      ${p.resume_court?`<div class="rc">${esc(p.resume_court)}</div>`:''}
    </li>`).join(''):'<li class="empty">Aucune pièce ne correspond. Élargissez les filtres.</li>';
}
$('list').addEventListener('click',e=>{const r=e.target.closest('.row');if(r)openSheet(r.dataset.id);});
$('list').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const r=e.target.closest('.row');if(r)openSheet(r.dataset.id);}});

function openSheet(id){
  const p=pieces.find(x=>x.id===id);if(!p)return;S.open=document.activeElement;
  $('sheetKicker').textContent=(p.genre||p.famille)+(p.edite?(p.editeur?' · éditée chez '+p.editeur:' · pièce éditée'):'')+(p.indispo?' · actuellement non disponible pour la création':'');
  $('sheetTitle').textContent=p.titre;
  const facts=[['Durée',p.duree?fmtDur(p.duree):''],['Distribution',castFull(p)],['Rôles',p.roles?p.roles+' rôles (avec doublages)':''],['Précisions',p.distribution&&!/^\d+\s*\(/.test(p.distribution)?p.distribution:''],['Âges des rôles',ageTxt(p)],['Écrite en',p.annee?String(p.annee):''],['Édition',p.editeur||'']].filter(r=>r[1]);
  const res=p.resume||p.resume_court||'';
  $('sheetBody').innerHTML=`<dl class="facts">${facts.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    ${res?res.split(/\n+/).map(par=>`<p class="res">${esc(par)}</p>`).join(''):''}
    ${(p.personnages||[]).length?`<div><span class="lbl2">Personnages</span><ul>${p.personnages.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    <div class="ask"><span class="lbl2">${p.indispo?'Pièce non disponible':'Recevoir le texte'}</span><p>${p.indispo?'Cette pièce est actuellement non disponible pour la création.':'Écrivez à l’auteur en précisant le titre et votre compagnie.'}</p>
      <a class="contact-link" href="https://lilianlloyd.com/pour-se-relier/" target="_blank" rel="noopener">Écrire à l’auteur →</a></div>`;
  $('scrim').hidden=false;$('sheet').hidden=false;setTimeout(()=>$('closeSheet').focus(),30);
}
function closeSheet(){$('scrim').hidden=true;$('sheet').hidden=true;if(S.open&&S.open.focus)S.open.focus();}
$('closeSheet').onclick=closeSheet;$('scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet();});

/* ---- PDF ---- */
const C={ink:[28,26,26],muted:[94,86,80],accent:[122,31,43],line:[223,211,194]};
const CP1252_EXTRA='€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ';
function clean(s){return String(s??'').replace(/[   ]/g,' ').replace(/[‐‑]/g,'-').replace(/−/g,'-').split('').filter(ch=>ch.charCodeAt(0)<256||CP1252_EXTRA.includes(ch)).join('');}
const PW=210,PH=297,M=20,TOP=22,BOTTOM=PH-20;
function selectionLabel(){
  const bits=[];const st=STATS.find(s=>s.k===S.stat);if(st&&st.k!=='all')bits.push(st.label);
  if(S.fam.size)bits.push([...S.fam].join(', '));
  const com=$('fCom').value;if(com)bits.push(com==='mod'?'distribution modulable':(com.endsWith('+')?parseInt(com)+' comédiens et plus':com+' comédien'+(com>1?'s':'')));
  const f=$('fF').value,h=$('fH').value;
  if(f)bits.push(f.endsWith('+')?parseInt(f)+' femmes et plus':f+(f>1?' femmes':' femme'));
  if(h)bits.push(h.endsWith('+')?parseInt(h)+' hommes et plus':h+(h>1?' hommes':' homme'));
  const d=$('fDur').value;if(d)bits.push({c:'1h10 ou moins',m:'1h15 à 1h20',l:'1h30 et plus'}[d]);
  const q=$('q').value.trim();if(q)bits.push('« '+q+' »');
  return bits.join(' · ');
}
function buildCatalogue(list){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4',compress:true});const W=PW-2*M;let y=TOP;
  doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...C.accent);doc.setCharSpace(.6);doc.text('LILIAN LLOYD · RÉPERTOIRE',M,y);doc.setCharSpace(0);y+=11;
  const all=list.length===pieces.length;
  doc.setFont('times','bold');doc.setFontSize(28);doc.setTextColor(...C.ink);doc.text(clean(all?'Le répertoire':'Sélection de pièces'),M,y);y+=7;
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...C.muted);
  const sel=selectionLabel();
  const sub=EDITION.version+' · '+longDate(EDITION.date)+' · '+list.length+' pièce'+(list.length>1?'s':'')+(sel?' · '+sel:'');
  const subL=doc.splitTextToSize(clean(sub),W);doc.text(subL,M,y);y+=subL.length*4.4+3;
  doc.setTextColor(...C.ink);doc.text(clean('Sauf mention contraire, les pièces sont disponibles pour la création. Contact : '+CONTACT),M,y);y+=6;
  doc.setDrawColor(...C.accent);doc.setLineWidth(.6);doc.line(M,y,M+24,y);y+=9;
  list.forEach((p,i)=>{
    doc.setFont('times','bold');doc.setFontSize(15);const tL=doc.splitTextToSize(clean(p.titre),W-22);
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);
    const rL=p.resume_court?doc.splitTextToSize(clean(p.resume_court),W):[];
    const h=tL.length*6+9.7+(rL.length?rL.length*4.5+1.5:0)+7;
    if(y+h>BOTTOM&&y>TOP+1){doc.addPage();y=TOP;}
    doc.setFont('times','bold');doc.setFontSize(15);doc.setTextColor(...C.ink);doc.text(tL,M,y+1);
    if(p.edite){doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor(...C.accent);doc.setCharSpace(.4);doc.text('ÉDITÉE',PW-M,y,{align:'right'});doc.setCharSpace(0);}
    if(p.indispo){doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor(...C.muted);doc.setCharSpace(.4);doc.text('ACTUELLEMENT NON DISPONIBLE',PW-M,y+(p.edite?3.6:0),{align:'right'});doc.setCharSpace(0);}
    y+=tL.length*6;
    const at=ageTxt(p);const meta=[p.editeur?'Éditée chez '+p.editeur:'',p.genre||p.famille,p.duree?fmtDur(p.duree):'',castFull(p),at?'Âges : '+at:''].filter(Boolean).join('  ·  ');
    doc.setFont('helvetica','normal');doc.setFontSize(8.8);doc.setTextColor(...C.accent);const mL=doc.splitTextToSize(clean(meta),W);doc.text(mL,M,y);y+=mL.length*4.2+1.3;
    if(rL.length){doc.setFontSize(9.5);doc.setTextColor(...C.ink);doc.text(rL,M,y,{lineHeightFactor:1.35});y+=rL.length*4.5+1.5;}
    if(i<list.length-1){doc.setDrawColor(...C.line);doc.setLineWidth(.2);doc.line(M,y,PW-M,y);}
    y+=7;
  });
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setDrawColor(...C.line);doc.setLineWidth(.2);doc.line(M,PH-14,PW-M,PH-14);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...C.muted);
    doc.text(clean('Lilian Lloyd, Répertoire '+EDITION.version+', '+EDITION.date+'  ·  '+CONTACT),M,PH-9);doc.text(i+' / '+n,PW-M,PH-9,{align:'right'});}
  return doc;
}
window.__cat=(mail)=>{const c=CONTACT;if(mail)CONTACT='lilianlloyd@ik.me';$('reset').click();const d=buildCatalogue(filtered());CONTACT=c;return d.output('datauristring');};
$('exportSel').onclick=async()=>{
  const list=filtered();if(!list.length||!S.dl)return;const btn=$('exportSel');btn.disabled=true;
  const all=list.length===pieces.length;
  const name=(all?'Répertoire Lilian Lloyd':'Lilian Lloyd - sélection de pièces')+' '+EDITION.version+' - '+EDITION.date+'.pdf';
  try{const doc=buildCatalogue(list);await S.dl.save({filename:name,data:doc.output('blob')});toast('PDF enregistré');}
  catch(e){const c=e&&e.code;
    if(c==='declined'){}
    else if(c==='unavailable'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){S.dl=null;render();toast('Le téléchargement n’est pas disponible ici.');}
    else toast('Le PDF n’a pas pu être généré. Réessayez.');}
  finally{btn.disabled=false;}
};

render();

})();
</script>
