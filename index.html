<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
:root{
  color-scheme:light;
  --ground:#F5EEE2; --surface:#FCF8F1; --surface-2:#EDE3D4; --ink:#1C1A1A; --muted:#5E5650; --line:#DFD3C2;
  --accent:#7A1F2B; --accent-soft:#F1DEDB; --on-accent:#FFFFFF; --femme:#C0582F; --homme:#3F5E6E; --libre:#5F8A55; --focus:#7A1F2B;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 60px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;align-items:end;padding-bottom:18px;border-bottom:1px solid var(--line)}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--accent);margin:0 0 8px}
.head h1{font-family:var(--serif);font-weight:600;font-size:clamp(34px,7vw,56px);line-height:.95;margin:0;letter-spacing:-.01em;text-wrap:balance}
.head h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.lede{margin:10px 0 0;max-width:58ch;color:var(--muted);font-size:15px}
.lede b{color:var(--ink);font-weight:600}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.contact .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.mailrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mail{font-family:var(--mono);font-size:14px;user-select:all;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.contact-link{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;justify-self:start}
.contact-link:hover{filter:brightness(1.08)}

.stats{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 12px}
.stat{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.stat b{font-family:var(--mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.stat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

.filters{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.frow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.field{display:grid;gap:4px;min-width:0}
.field label,.lbl2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.search{flex:1 1 260px}
input[type=search],select{width:100%;background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.small select{width:auto;min-width:92px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.reset{margin-left:auto;background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.toggle-filters{display:none;border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:8px 14px;cursor:pointer}
.more{display:grid;gap:12px}

.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin:18px 0 6px}
.bar-left{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.count{font-size:13px;color:var(--muted)}
.count b{color:var(--ink);font-family:var(--mono);font-weight:500}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}

ul.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--surface-2)}
.row .t{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.15;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.badge-indispo{font-family:var(--sans);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:2px 7px;white-space:nowrap}
.badge{font-family:var(--sans);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:2px 7px;white-space:nowrap}
.row .meta{grid-column:1;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.row .rc{grid-column:1;font-size:14px;line-height:1.4;margin-top:2px;max-width:78ch}
.row .cast{grid-column:2;grid-row:1 / -1;display:grid;justify-items:end;gap:4px;text-align:right;align-self:start}
.row .cast .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pips{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;max-width:150px}
.pip{width:9px;height:9px;display:inline-block}
.pip.f{background:var(--femme);border-radius:50%}
.pip.h{background:var(--homme);border-radius:1px}
.pip.x{background:var(--libre);transform:rotate(45deg) scale(.85)}
.pip.m{width:auto;height:auto;font-size:11px;color:var(--muted);font-style:italic}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.foot{margin-top:28px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}

.scrim{position:fixed;inset:0;background:rgba(28,16,18,.45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18)}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 14px;border-bottom:1px solid var(--line)}
.sheet h2{margin:0;font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.05;overflow-wrap:anywhere;text-wrap:balance}
.sheet .body{overflow:auto;padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 24px);display:grid;gap:18px;align-content:start}
.x{background:none;border:none;font-size:28px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0}
dl.facts dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding-top:3px}
dl.facts dd{margin:0}
.res{font-family:var(--serif);font-size:19px;line-height:1.45;margin:0;max-width:60ch}
.ask{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
.ask p{margin:0;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 16px;border-radius:999px;font-size:14px;z-index:30}

@media (max-width:640px){
  .head{grid-template-columns:1fr}
  .toggle-filters{display:inline-flex}
  .filters.collapsed .more{display:none}
  .row .t{font-size:20px}
  .legend{width:100%}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<script>
const DATA=[{"id": "a-la-fin-c-est-gandhi-qui-gagne", "titre": "À la fin, c'est Gandhi qui gagne", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 65, "annee": 2019, "comediens": 10, "f": 3, "h": 7, "libre": 0, "roles": null, "modulable": false, "distribution": "10 rôles (3F/7H, dont 2 garçons joués par des adultes) ; médecins doublables", "resume_court": "Un enfant traité de « sale juif » dans la cour de récré, et des parents qui, pour l’aider, ressortent l’humour noir familial.", "resume": "Dans la cour de récréation, Kader lance « sale juif » à Raphaël. Le soir, Raphaël demande à sa mère pourquoi c’est sale d’être juif. Ronit veut monter au créneau ; Michaël, son mari, préfère en rire, l’humour familial en guise d’arme de défense. La principale convoque les parents. En face, Alexandra, mère débordée qui porte le nom algérien d’un futur ex-mari à la dérive, n’a pas le temps, et Mohammed, le grand-père de Kader, s’en mêle à la sortie de l’école. Pendant que les adultes s’empêtrent dans leurs préjugés croisés (« radicalisé », vraiment ?), les enfants posent les questions qui fâchent : si « sale arabe » est interdit, qu’en est-il de « sale con » ?", "personnages": ["Raphaël, 8 ans (joué par un adulte)", "Ronit, sa mère, 35-45 ans", "Michaël, son père, 35-45 ans", "Moshé, le père de Ronit, 65-75 ans", "Kader, son camarade de classe, 8 ans (joué par un adulte)", "Alexandra, la mère de Kader, 30-40 ans", "Mohammed, le grand-père de Kader, 60-70 ans", "La principale, 45-55 ans", "Les médecins (doublables)"], "ages": ["j", "a"]}, {"id": "a-trois-pas-du-ciel", "titre": "À trois pas du Ciel", "famille": "Comédie dramatique", "genre": "Comédie dramatique d'anticipation (fin du monde climatique)", "duree": 80, "annee": 2015, "comediens": 2, "f": 1, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "2 (1F/1H)", "resume_court": "La date de la fin du monde est connue : l’effondrement a été annoncé, et rien n’a été fait. Dans un bar en ruines, Noé, ancien communicant de l’industrie pétrolière qui a su et s’est tu, rencontre Andréa, ancienne militante écologiste qui a fini par renoncer. Peut-on encore tomber amoureux quand tout s’arrête ?", "resume": "Un rapport international a fixé la date précise de l’effondrement des écosystèmes : dans quelques jours, la vie humaine sera impossible. Plus personne ne peut dire qu’il ne savait pas : la fin du monde est le résultat d’une décision collective de ne rien faire. Les gens, résignés, ont déserté les grandes villes. C’est dans l’une d’elles, au fond d’un vieux bar aux murs couverts d’affiches de manifs arrachées, que Noé rencontre Andréa. Lui, 54 ans, timide, maladroit, malheureux en amour, a passé des années à rendre présentables les compagnies pétrolières ; il savait, il s’est tu. Elle, 46 ans, ancienne militante écologiste, a manifesté, a été arrêtée, a cru, puis a abandonné, par épuisement. Elle se promène encore avec son pied de biche, relique de celle qu’elle a été, et attend que tout s’éteigne avec un drôle de bonheur. Leurs rendez-vous, pour ponctuer l’attente du rideau qui doit tomber, posent une seule question : alors que la fin de tout est proche, peut-on encore tomber amoureux ?", "personnages": ["Noé, 54 ans", "Andréa, 46 ans"], "ages": ["a"]}, {"id": "au-sein-des-creux", "titre": "Au sein des creux", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 70, "annee": 2009, "comediens": 2, "f": 2, "h": 0, "libre": 0, "roles": null, "modulable": false, "distribution": "2 (2F)", "resume_court": "Deux femmes, l’une seule, l’autre découvrant qu’elle l’est aussi, se croisent à six reprises sur plusieurs mois.", "resume": "Chloé fabrique des mannequins dans un appartement sans cadre ni photo, dont la porte n’est jamais fermée à clé. Sandrine, mariée, « émotive graduelle » selon son psy, débarque dans sa vie et dans ses bras. Entre elles, six rendez-vous espacés de quelques mois, chez Chloé ou au même bar ; entre chaque rendez-vous, chacune parle seule à celle qui n’est pas là. Elles s’apprivoisent, s’opposent, se blessent : une excuse qui rencontre une humiliation, un cadeau de Noël, un ventre où quelque chose pousse. Chloé s’accroche à son cynisme et à ses fêlures ; Sandrine découvre qu’au milieu d’une vie bien remplie, elle est aussi seule qu’elle.", "personnages": ["Chloé, trente ou quarante ans", "Sandrine, la trentaine"], "ages": ["a"]}, {"id": "avec-panache", "titre": "Avec panache", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 75, "annee": 2025, "comediens": 3, "f": 1, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "3 (1F/2H) ; le client doublable", "resume_court": "Roxane, travailleuse du sexe qui assume son métier, jongle entre ses clients et son frère schizophrène, Berlioz. La mort annoncée de sa mère et le retour de son père la précipitent, avec un client pris en otage, dans un road trip qui fait voler ses certitudes en éclats.", "resume": "Roxane, la trentaine, est une travailleuse du sexe très à l’aise avec son métier. Elle se partage entre ses clients, tous amoureux d’elle, et la charge de son jeune frère, Berlioz, schizophrène qui se grime en clown. Cet équilibre précaire, dont elle s’amuse, est bousculé d’un coup par la mort annoncée de sa mère et le retour imprévu de son père. Elle prend en otage Numéro 12, son client favori, et les voilà partis à trois pour un road trip qui va bousculer ses certitudes.", "personnages": ["Roxane, la trentaine", "Berlioz, son frère, la petite vingtaine", "Numéro 12, son client favori, 45 ans"], "ages": ["j", "a"]}, {"id": "babyfoot", "titre": "Babyfoot", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 90, "annee": 2014, "comediens": 4, "f": 0, "h": 4, "libre": 0, "roles": null, "modulable": false, "distribution": "4 (4H)", "resume_court": "Tom, Ben, Léo et Jo, inséparables ados, se retrouvent la quarantaine venue dans le bar de leur jeunesse. Une nuit de tempête, un vieux secret remonte, pour les diviser, ou les réunir.", "resume": "", "personnages": ["Tous les personnages ont dans la quarantaine"], "ages": ["a"], "indispo": true}, {"id": "bon-courage", "titre": "Bon courage !", "famille": "Comédie", "genre": "Comédie sociale (co-écrite avec Kader Nemer)", "duree": 90, "annee": 2025, "comediens": 7, "f": null, "h": null, "libre": 0, "roles": 9, "modulable": false, "distribution": "9 rôles (3F/6H) pour 7 comédiens min. + voix off (le fils, Gemini)", "resume_court": "Julien, cuisinier au chômage depuis quatre ans, débarque à France Travail avec ses couteaux pour prouver qu’il sait encore travailler. Un geste de trop, et le voilà pris pour un forcené.", "resume": "", "personnages": ["Julien, 45 ans", "Marlène, 55-62 ans", "John-Nathan, 30-40 ans", "Linda, 20-25 ans", "Fatima, 45-55 ans", "Cyrille, 25-40 ans", "Gauthier, 25-35 ans", "Tommy, au téléphone, 40-50 ans", "Voix off : le fils de Julien, Gemini"], "ages": ["j", "a"], "indispo": true}, {"id": "c-est-un-beau-roman", "titre": "C'est un beau roman…", "famille": "Comédie", "genre": "Comédie", "duree": 70, "annee": 2014, "comediens": 2, "f": 1, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "2 (1F/1H)", "resume_court": "Léo attend sa rencontre arrangée en insultant au téléphone la « baleine » qu’on lui présente, avant de découvrir que la baleine, c’est Anna, déjà face à lui.", "resume": "Devant sa voiture bien astiquée, Léo attend sa rencontre arrangée en insultant au téléphone la « baleine » dont il a vu la photo. Sauf qu’Anna est déjà là, face à lui, et qu’elle a tout entendu. Elle ne lui en veut pas, ou fait semblant : elle le connaît depuis l’école, elle a un vieux compte à régler, et elle prend le volant. Commence un road trip en forme d’enlèvement joyeux, de station-service en contrôle de gendarmerie, autoradio à fond et chanson fausse, où Anna, vénéneuse et imprévisible, balade Léo, séducteur devenu victime, à travers ses souvenirs et ses lâchetés d’il y a vingt ans. Plus la route avance, plus Léo comprend qu’elle ne l’a pas embarqué par hasard, et que quelqu’un l’attend au bout du chemin.", "personnages": ["Léo et Anna, entre trente-cinq et quarante ans"], "edite": true, "ages": ["a"], "editeur": "Tertium Éditions"}, {"id": "ce-court-instant-de-bonheur", "titre": "Ce court instant de bonheur", "famille": "Comédie romantique", "genre": "Comédie romantique", "duree": 70, "annee": 2001, "comediens": 4, "f": 2, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "4 (2F/2H)", "resume_court": "Nico et Laura cherchent chacun de leur côté de quoi combler un vide ; Tom et Anne, leurs meilleurs amis, racontent et commentent leur histoire.", "resume": "Nico et Laura ne se connaissent pas. Ils vivent d’un bout à l’autre d’une grande métropole et rien ne les prédestine à se rencontrer : des anonymes qui pourraient se croiser dans le métro. Lui est un poète qui vivote en colocation avec son meilleur ami, Tom. Elle, qui vit aussi avec sa meilleure amie, Anne, passe son temps à cumuler les histoires d’amour impossibles, de préférence avec des hommes mariés. Et puis, un soir de dérive, les voilà tous les deux dans le même bar. Ils vont essayer de composer quelque chose ensemble, malgré tout ce qui les oppose. Particularité : leur histoire est narrée et commentée par celle et celui qui les connaissent le mieux, Anne et Tom…", "personnages": ["Tous les personnages ont entre 25 et 30 ans"], "ages": ["j"]}, {"id": "ce-qui-effleure-les-femmes", "titre": "Ce qui effleure les femmes !", "famille": "Comédie romantique", "genre": "Comédie romantique", "duree": 70, "annee": 2006, "comediens": 3, "f": 3, "h": 0, "libre": 0, "roles": null, "modulable": false, "distribution": "3 (3F)", "resume_court": "Camille, Juliette et Sandrine, à trois âges de la vie amoureuse. Un fiancé infidèle, un Roméo trouvé par petite annonce, un enfant sans père : trois femmes qui s’épaulent, s’engueulent et se mettent à nu.", "resume": "Camille, Juliette et Sandrine sont trois femmes à différents stades de la vie. Camille, fleuriste, file un amour tranquille avec Franck, jusqu’au jour où Sandrine, sa demi-sœur, vient lui annoncer qu’il la trompe. Juliette, sa collègue à la boutique, se déclare célibataire à la face du monde, voit la mort partout depuis qu’une femme s’est jetée sous le RER devant elle, et croit enfin tenir son Roméo grâce à une petite annonce. Sandrine, qui élève seule son petit garçon, se trouve le regard « le plus con de la planète » et n’a plus beaucoup d’illusions. En s’épaulant, en s’écoutant, en s’engueulant, les trois femmes se mettent à nu.", "personnages": ["Camille, jeune femme", "Sandrine, sa demi-sœur, la trentaine", "Juliette, 25 ans"], "ages": ["j", "a"]}, {"id": "comme-on-craque-une-allumette", "titre": "Comme on craque une allumette", "famille": "Comédie", "genre": "Comédie (« une petite pièce entre amis »)", "duree": 60, "annee": 2006, "comediens": 4, "f": 2, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "4 (2F/2H)", "resume_court": "Léandre, qui vient de rater son suicide sans que personne ne le remarque, croise Mathilde, ivre et à la dérive elle aussi. Rencontre entre deux naufrages, un soir de réveillon.", "resume": "Le soir du réveillon, chez Alice. Dehors, on hurle « bonne année » ; Léandre, lui, n’arrive pas à allumer sa cigarette depuis trois jours, comme si son ange gardien soufflait sur chaque flamme. Mathilde, qui en est à son sixième verre et cherche à se noyer elle-même, lui propose du feu, sans plus de succès. Deux naufragés qui ne se connaissent pas et se reconnaissent tout de suite. Autour d’eux, la soirée déraille : Denis, le meilleur ami dépressif dont Léandre a la garde, s’enferme aux toilettes avec du white-spirit, joue avec les fils électriques du garage et mélange ses antidépresseurs à l’alcool ; Alice, la maîtresse de maison, qui visait un orgasme « à cheval sur deux ans » et l’a raté à cause d’une montre qui avançait, traverse la soirée en faisant tic-tac. Entre deux sauvetages, Léandre et Mathilde se tendent la main, chacun persuadé que c’est l’autre qui se noie.", "personnages": ["Léandre, la trentaine", "Mathilde, la trentaine", "Alice, la trentaine", "Denis, le meilleur ami de Léandre, la trentaine"], "ages": ["a"]}, {"id": "comme-un-arbre-penche", "titre": "Comme un arbre penché", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 80, "annee": 2013, "comediens": 3, "f": 1, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "3 (1F/2H)", "resume_court": "Douze ans après une dispute, Louis retrouve Philippe, son ami d’enfance, sur un lit d’hôpital : enfermé dans un locked-in syndrome, il ne peut plus bouger qu’une paupière. Visite après visite, Louis se met à tout lui dire.", "resume": "Douze ans après une dispute, un accident réunit Louis et Philippe, amis d’enfance. Quand Louis entre dans la chambre d’hôpital, une boîte de chocolats à la main, il compte renouer une amitié « à la vie à la mort » brisée net. Mais Philippe est muré dans un locked-in syndrome : il ne peut plus bouger que la paupière. Ce qui devait être des retrouvailles devient un monologue, puis autre chose, grâce à un petit alphabet de clignements d’yeux et à Mathilde, la jeune aide-soignante, qui fait office de médiatrice. Au fil des visites et des saisons, entre la mère envahissante au bout du portable, un soir de Saint-Sylvestre trop arrosé et un numéro de Père Noël pour faire rire le gisant, Louis tourne autour de ce qui les a séparés.", "personnages": ["Louis, la soixantaine", "Philippe, la soixantaine, son ami d’enfance", "Mathilde, 30-40 ans"], "edite": true, "ages": ["j", "s"], "editeur": "L’Avant-Scène Théâtre"}, {"id": "comme-un-pere-anomake", "titre": "Comme un père", "famille": "Comédie", "genre": "Comédie", "duree": 80, "annee": 2009, "comediens": 2, "f": 1, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "2 (1F/1H)", "resume_court": "Philippe, cinquante ans, Dom Juan de canton et peintre sans talent, coule des jours tranquilles dans le Jura. Jusqu’à ce que débarque Louise, la fille qu’il a laissée au berceau vingt-cinq ans plus tôt, l’urne de sa mère sous le bras. Un orage les enferme ensemble pour la nuit.", "resume": "Philippe a cinquante ans et l’âme d’un éternel jeune homme. Retiré dans une maison en bois du Jura, il peint sans talent, vit de petits boulots et fréquente des amies de dix-neuf ans. Un jour de pluie, Louise pousse la porte. Elle a vingt-cinq ans, un caractère bien trempé, une cigarette toujours prête, et l’urne de sa mère dans les bras, avec quelques mégots dedans, faute de cendrier dans la voiture. C’est la fille qu’il a laissée quelques mois après sa naissance, et la défunte l’a chargée de venir le trouver. Philippe veut la mettre dehors, mais l’orage coupe la route et la voiture refuse de démarrer. Une nuit entière, entre croque-monsieur de légende, garde-robe de très jeunes amies et coup d’urne dans la mâchoire, ces deux inconnus du même sang vont devoir apprendre à se dire bonjour.", "personnages": ["Philippe, 45-50 ans", "Louise, 20-25 ans"], "ages": ["j", "a"]}, {"id": "d-un-claquement-de-doigts", "titre": "D'un claquement de doigts", "famille": "Drame & thriller", "genre": "Drame", "duree": 80, "annee": 2023, "comediens": 3, "f": 2, "h": 1, "libre": 0, "roles": 11, "modulable": false, "distribution": "11 rôles jouables à 3 (2F/1H)", "resume_court": "Anna, femme de pouvoir controversée, et Jeanne, électron libre et cynique, se lient d’amitié envers et contre tout. Une enquête mystérieuse sur qui est vraiment Jeanne, à travers les époques.", "resume": "Elles n’ont rien en commun et vont pourtant se lier d’amitié. D’un côté, Anna, femme de pouvoir controversée ; de l’autre, Jeanne, électron libre et cynique. Ce qui pourrait être une histoire simple se transforme en rencontre mystérieuse et étonnante. L’univers d’Anna s’en retrouve bouleversé, à tel point que les époques se mélangent et qu’un grand voyage initiatique l’attend pour répondre à cette question : qui est véritablement Jeanne ?", "personnages": ["Anna, 45-55 ans", "Jeanne, 30-40 ans", "Neuf autres rôles pour le troisième comédien et les deux comédiennes : Lucie, Claire, Arnoux, Pedro, Eva, Yves, un médecin, une journaliste radio, la mère, le père"], "ages": ["a"]}, {"id": "dans-l-ordre-des-choses", "titre": "Dans l'ordre des choses", "famille": "Comédie douce-amère", "genre": "Comédie douce-amère", "duree": 90, "annee": 2011, "comediens": 5, "f": 2, "h": 3, "libre": 0, "roles": null, "modulable": false, "distribution": "5 (2F/3H)", "resume_court": "Camille règle ses comptes avec Paul dans le jardin d’une fête, verre de champagne à la main. Ce qu’on n’a jamais su se dire, enfin déversé, sans savoir si ça répare ou si ça enterre.", "resume": "Paul et Camille se sont follement aimés. Lui utilise l’humour à tour de bras, pour séduire comme pour se protéger. Elle a un caractère bien trempé et une bonne dose de cynisme. Un événement tragique va les séparer. Leurs retrouvailles, quatre ans plus tard, dans le jardin qui a vu naître leur amour, sont l’occasion de se remémorer les bons comme les mauvais souvenirs, et de revenir sur les erreurs du passé. Autour d’eux, leurs meilleurs amis, Simon et Victoire, témoins privilégiés de cette relation unique au fil du temps. Et au-dessus de tout ce beau monde, Martin, regard espiègle sur tous les évènements, tantôt taquin, tantôt malin, toujours présent, et qui garde en lui un grand secret qui lie Paul et Camille…", "personnages": ["Tous les personnages ont entre 30 et 40 ans"], "ages": ["a"]}, {"id": "dans-le-decor", "titre": "Dans le décor !", "famille": "Comédie", "genre": "Comédie satirique", "duree": 90, "annee": 2002, "comediens": 12, "f": 7, "h": 5, "libre": 0, "roles": null, "modulable": false, "distribution": "12 (7F/5H) + un cameraman muet", "resume_court": "Une équipe de comédiens vedettes se prépare, sous l’œil d’une journaliste, à monter sur scène : rivalités d’ego, fausse solidarité et vraie comédie de coulisses, filmées en direct.", "resume": "Soir de première dans les coulisses de « L’amour glissa de vos lèvres », la nouvelle création de Denis Chéreau, jeune auteur metteur en scène en vogue. Une journaliste et son cameraman filment en direct une distribution de rêve : une star qui revient au théâtre après une longue absence, un monstre sacré qui planque son rouge dans le décor, sa fille qui ne jure que par le crocodile Lacoste, un jeune premier latin aux mains baladeuses, des comédiennes qui se détestent cordialement, un producteur qui distribue des cigares et un régisseur qui compte les minutes. On ne voit jamais la pièce, seulement ce qui se passe derrière : les répliques ratées, les minerves, les jalousies, les coups bas, les amours qui se font et se défont entre deux entrées en scène, pendant que Denis voit sa première lui échapper.", "personnages": ["Denis, 25-35 ans", "Sarah, Gérard, Isabelle, Romy, Vincent, Josiane, Luis, Line, Myriam, Clotilde : de 20 à 60 ans selon les rôles", "Le régisseur, 40-55 ans", "Un cameraman (muet)"], "ages": ["j", "a"]}, {"id": "de-bonnes-ondes", "titre": "De bonnes ondes", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 75, "annee": 2025, "comediens": 4, "f": 2, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "4 (2F/2H)", "resume_court": "Nice, décembre 1999 : Sacha, animatrice radio, doit liquider en une nuit l’héritage de sa mère alcoolique tout juste morte, pendant qu’un frère bipolaire, un ex peu fiable et une fille longtemps délaissée débarquent sous la tempête. La vraie fin du monde, c’est peut-être celle qu’on porte en soi.", "resume": "Nice, fin 1999. Sacha, 45 ans, anime depuis quinze ans « Nuit Blanche », une émission nocturne sur une radio locale, où les auditeurs se confient sur leur vie et leurs angoisses du bug de l’an 2000. Solitaire, elle voit son équilibre vaciller : sa radio va être rachetée par Europe 1, qui lui laissera peu de liberté à l’antenne. Pour couronner le tout, sa mère, avec qui elle avait des rapports plus que conflictuels, vient de mourir, et ce n’est pas son frère Félix, qui enchaîne crises existentielles et tentatives de suicide, qui va vider la maison de l’arrière-pays niçois. Ajoutez-y le retour de Marc, son ancien amant, un peu escroc sur les bords, aux intentions floues. Et enfin Clara, sa fille, qu’elle a un peu abandonnée à l’âge de dix ans pour aller vivre sa vie… Tout ce beau monde doit cohabiter pendant que les tempêtes Lothar et Martin balaient la France et que monte la crainte du bug. Chacun porte un secret ; s’il doit y avoir une fin du monde, ce sera la fin d’un monde, et des barrières qui tombent.", "personnages": ["Sacha, 45 ans", "Clara, sa fille, 25 ans", "Félix, son frère, 35-45 ans", "Marc, son ancien amant, 45-55 ans", "Voix des auditeurs"], "ages": ["j", "a"]}, {"id": "de-folles-promesses", "titre": "De folles promesses", "famille": "Comédie douce-amère", "genre": "Comédie douce-amère", "duree": 70, "annee": 2019, "comediens": 4, "f": 1, "h": 3, "libre": 0, "roles": null, "modulable": false, "distribution": "4 (1F/3H)", "resume_court": "Granville, un soir d’été, dans un jardin au bord de la falaise. Roland, Noémie et Marc, les comédiens de toujours de Stéphan, ont rendez-vous avec lui pour une dernière mise en scène réglée à la minute près : le coucher du soleil, et peut-être enfin le rayon vert.", "resume": "Granville, un soir d’été. Dans le jardin d’une maison qui surplombe la falaise, Stéphan, auteur de théâtre, a tout prévu : les fleurs, le banc, quatre bouteilles de champagne et l’heure exacte du coucher du soleil, 21h21. Ses comédiens de toujours sont convoqués. Roland, ventre généreux et trois pensions à verser, a oublié dans sa voiture le carton qu’on lui avait confié. Noémie remet tout le monde à sa place avant même que Stéphan intervienne. Marc reste planté devant le portail : il a des comptes à régler avec l’auteur, et pas seulement de théâtre. Pendant que la marée monte, les souvenirs remontent avec elle : la petite compagnie qui devait passer un cap, les tournées, les amours, le jour où Marc a jeté l’éponge. Il leur reste une heure pour tenir leurs promesses d’hier, et apercevoir ce rayon vert que Stéphan guette depuis cinquante ans.", "personnages": ["Stéphan, 60-70 ans", "Roland, 55-65 ans", "Noémie, 50-60 ans", "Marc, 55-65 ans"], "ages": ["a"]}, {"id": "de-la-petite-couture", "titre": "De la petite couture", "famille": "Autres formes", "genre": "Pièce musicale (musiques Laurie Gérard et Michel-André Jouveaux)", "duree": 65, "annee": 2023, "comediens": 1, "f": 1, "h": 0, "libre": 0, "roles": null, "modulable": false, "distribution": "1 (1F)", "resume_court": "Lou raconte sa vie au piano : une mère qui exige le silence, un homme qui cogne et qui trompe, et Denis, le surnom qu’elle donne à sa tumeur.", "resume": "Lou, professeure de musique, raconte sa vie depuis son piano. Enfant, elle a grandi sous le « chut » d’une mère épuisée qui confond la musique et le bruit. À dix-sept ans, elle tombe dans les bras de « l’Autre », qui perdra son prénom à force de répéter ses coups et ses tromperies, pendant que sa mère lui conseille de se taire, comme elle-même s’est tue. À trente-trois ans, un oncologue qu’elle rebaptise George lui annonce une tumeur au cerveau ; Lou l’appelle Denis et lui donne un corps, une voix et même une chanson. Entre l’hôpital, la chimio, la petite Ava et les « schémas » qui ruissellent de mère en fille, elle se raconte avec un humour qui lui sert de gilet pare-balles.", "personnages": ["Lou, une trentaine d’années (raconte sa vie depuis l’enfance)"], "ages": ["a"]}, {"id": "de-la-place-pour-deux-nouvelle-version", "titre": "De la place pour deux", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 80, "annee": 2024, "comediens": 2, "f": 1, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "2 comédiens (1F/1H), plusieurs rôles", "resume_court": "Léandre, schizophrène évadé de l’hôpital psychiatrique, retrouve sa demi-sœur Lucie. Tom, son ami imaginaire, prend chair sur scène.", "resume": "", "personnages": ["Léandre, 35-45 ans", "Lucie, sa demi-sœur, de dix ans sa cadette, 25-35 ans", "Tom, l’ami imaginaire de Léandre, sans âge"], "ages": ["a"], "indispo": true}, {"id": "des-accordes", "titre": "Des Accordés", "famille": "Comédie romantique", "genre": "Comédie romantique", "duree": 70, "annee": 2010, "comediens": 2, "f": 1, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "2 (1F/1H)", "resume_court": "Dans un couloir de métro, Sam, qui vit à la rue, bute toujours sur le même accord de sa vieille guitare. Louis, un inconnu survolté, lui prend l’instrument, passe le do majeur et revient le lendemain. Puis il l’emmène chez lui.", "resume": "Dans un couloir de métro, Sam gratte une vieille guitare qui sonne faux et bute toujours sur le même accord. Elle vit dans la rue, boite un peu, et ne lâche jamais son instrument. Louis, survolté, emmitouflé dans plusieurs couches de vêtements dépareillés, s’arrête, lui prend la guitare, passe le do majeur sans effort et lui rend son euro. Il revient le lendemain, et le surlendemain, sans un mot. Puis il l’emmène chez lui : un matelas par terre, une table pliante, une douche, un sapin de Noël improvisé. Entre deux apartés au public, ces deux-là s’apprivoisent à coups de chamailleries, de danses et de leçons de guitare ratées, chacun avec ses fantômes : un hamster qui hante les nuits de Louis, un père que Sam a peut-être tué il y a dix ans.", "personnages": ["Sam, une vingtaine d’années, presque trente", "Louis, une vingtaine d’années, presque trente"], "edite": true, "ages": ["j", "a"], "editeur": "Éclats d’encre"}, {"id": "des-espoirs-en-bandouliere", "titre": "Des Espoirs en Bandoulière", "famille": "Comédie", "genre": "Comédie", "duree": 90, "annee": 2006, "comediens": 3, "f": 1, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "3 (1F/2H)", "resume_court": "Une nuit de pluie, sous un abribus, Roxanne, Dwayne et Thomas, trois inconnus, partent ensemble pour un road trip immobile vers l’amour et l’absolu.", "resume": "Une nuit de pluie, sous un abribus. Roxanne, la jeune vingtaine, maquillage de fille de joie et larmes qui ont coulé, serre entre ses doigts une cigarette qu’elle ne fume jamais. Dwayne, la trentaine, et Thomas, citadin qui n’utilise ses pieds que pour monter dans le bus, n’ont rien à faire là non plus. Ils ne se connaissent pas ; ils partent ensemble. Direction : l’amour, l’absolu, une île imprudente pour les gens comme eux. La voiture n’existe pas, Roxanne la désigne sur le trottoir et tout le monde monte. Commence un road trip immobile, entre autoradio, arrêts pour danser et vomir ses idées noires, bagarre qui laisse Thomas le nez en sang, et confidences sur ce qui leur manque le plus : l’amour d’un père, d’une mère, ou simplement d’eux-mêmes.", "personnages": ["Roxanne, la jeune vingtaine", "Dwayne, une trentaine d’années", "Thomas, entre vingt et trente ans"], "ages": ["j"]}, {"id": "des-espoirs-en-bandouliere-version-leandre-louise", "titre": "Léandre et Louise", "famille": "Comédie romantique", "genre": "Comédie romantique", "duree": 80, "annee": 2005, "comediens": 3, "f": 2, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "3 (2F/1H)", "resume_court": "Louise et Léandre, amants d’autrefois qui se cognent encore d’amour et de rancune, rejouent leurs souvenirs sous l’œil de L’Onde, narratrice, Cupidon et mémoire vive.", "resume": "Louise et Léandre se sont aimés, se sont perdus, et se cognent encore d’amour et de rancune. Ce soir, il est devant sa porte, un cadeau à la main et les jambes qui flageolent ; elle suce son pouce et jure qu’elle n’est plus du tout amoureuse. Entre eux circule L’Onde, narratrice espiègle, Cupidon à ses heures et mémoire vive, qui annonce les scènes comme on tourne les pages, fait revivre leurs premières fois, leurs disputes et ce test de grossesse caché un matin, et va jusqu’à s’installer dans le ventre de Léandre. Présent et souvenirs s’entrechoquent, jusqu’à ce que Léandre, qui écrit leur histoire, cherche désespérément comment la finir.", "personnages": ["Léandre, la trentaine", "Louise, la trentaine", "L’Onde, sans âge"], "ages": ["a"]}, {"id": "des-maux-sans-lendemain", "titre": "Des maux sans lendemain", "famille": "Comédie", "genre": "Comédie", "duree": 90, "annee": 2002, "comediens": 5, "f": 2, "h": 3, "libre": 0, "roles": null, "modulable": false, "distribution": "5 (2F/3H)", "resume_court": "Une bande de jeunes comédiens décroche un théâtre pour un mois et monte une pièce que leur auteur écrit au jour le jour. Les répétitions tournent aux règlements de comptes : amours d’hier, jalousies de coulisse, pages blanches.", "resume": "Un soir de Noël, cinq amis autour d’une table : Harold, auteur taiseux qui ne se remet pas du départ de Léa ; Léa, qui revient comme si de rien n’était ; Jeff, grand garçon mal fagoté qui rêve de gloire ; Alice, qui boit pour faire couler quelque chose ; et Martin, coiffeur pour dames, qui raconte toute l’histoire à une cliente, sous le casque. Quand Harold décroche un théâtre pour un mois et la promesse, pour la première fois, d’être payés, la bande se lance dans la création d’une pièce qu’il écrira au jour le jour. Mais les répétitions deviennent le terrain de tous les règlements de comptes : les amours d’hier rejouées en scène, les jalousies de coulisse, les pages blanches, la baffe de trop. Et ce spectacle, comme le titre le laisse deviner, n’est pas sûr de voir le jour.", "personnages": ["Les personnages ont entre 25 et 35 ans"], "edite": true, "ages": ["j", "a"], "editeur": "Éclats d’encre"}, {"id": "des-nuits-a-rebours", "titre": "Des nuits à rebours", "famille": "Drame & thriller", "genre": "Drame, thriller", "duree": 90, "annee": 2008, "comediens": 5, "f": 4, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "5 (4F/1H) ; la Mère jouée par la comédienne de Gene", "resume_court": "Quatre sœurs tiennent un hôtel isolé où ne passe jamais personne, jusqu’à l’arrivée d’un homme sans passé qui réveille de vieux fantômes.", "resume": "Quatre sœurs, Lily, Gene, Diva et Rose, tiennent un hôtel isolé où ne passe jamais personne, jusqu’au jour où un homme sans passé vient réveiller de vieux fantômes. Cet homme, Personne, est l’archétype de l’Autre : celui qui dérange par son regard, celui qui devine et met mal à l’aise.", "personnages": ["Lily, Gene, Diva et Rose, quatre sœurs, de 25 à 40 ans", "Personne, un homme d’une quarantaine d’années", "La Mère, jouée par la comédienne de Gene"], "ages": ["j", "a"]}, {"id": "des-peines-perdues", "titre": "Des peines perdues", "famille": "Drame & thriller", "genre": "Drame en fragments", "duree": 80, "annee": 2017, "comediens": 11, "f": 9, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "11 comédiens (9F/2H), Didier en fil rouge", "resume_court": "Un homme qui préfère rêver sa vie plutôt que la vivre se réveille un matin auprès d’une femme, sommé pour une fois de ne pas se dérober.", "resume": "Un rez-de-chaussée, un lit défait, un matin. Didier, grand type qui écrit sous pseudo et préfère imaginer sa vie plutôt que la vivre, se réveille à côté de Cécile, ramassée la veille dans un bar, et la congédie à coups de méchancetés. Suivent d’autres femmes de passage : Claire qui feuillette son manuscrit, Maëlle qui a lu un de ses livres chipé chez lui, Adeline qui exige qu’il demande pardon au lieu de s’excuser, Sonia qui compare le vide en lui au tourbillon d’un évier, Karine qui le déclare tordu. Toutes butent sur la même photo collée au frigo, celle d’une absente qu’aucune ne remplace. Entre ces duos au saut du lit s’intercalent des monologues de femmes et des couples en miroir : Claire et Fred qui se rendent la clé, Fred qui file en pleine nuit de chez Lison, deux filles dans un bar qui comparent leurs débutantes. Didier, lui, continue d’écrire sur la vie des autres, pendant que chaque amante lui annonce qu’elle ne fera que la béquille.", "personnages": ["Didier, la quarantaine", "Fred, la trentaine", "Cécile, Claire, Maëlle, Adeline, Sonia, Karine, Lison et deux jeunes femmes au bar : de 25 à 45 ans"], "ages": ["j", "a"]}, {"id": "des-vacances-a-l-amer-souriez", "titre": "Des vacances à l'amer", "famille": "Comédie", "genre": "Comédie", "duree": 90, "annee": 2020, "comediens": 8, "f": 3, "h": 5, "libre": 0, "roles": null, "modulable": false, "distribution": "8 (3F/5H)", "resume_court": "Deux groupes de vacanciers que tout oppose doivent cohabiter dans la même maison au Pays basque : l’un mené par un couple d’extrême droite et sa belle-sœur psychopathe.", "resume": "Dans une maison de vacances loin de tout, au Pays basque, un groupe de copains a décidé de passer quelques jours. Jean, Simon, David et Pierre ont tous les quatre pas mal de choses à oublier et comptent bien en profiter pour se détendre ensemble. Sauf que… la fameuse maison est déjà occupée par un autre groupe, avec à sa tête Nicolas, leader d’extrême droite, accompagné de sa femme raciste, de sa belle-sœur, psychiatre psychopathe, et d’une gourou. La cohabitation va forcément être catastrophique, et pousser tout ce (vilain) beau monde à montrer le pire de sa personnalité…", "personnages": ["Jean, Simon, David et Pierre, 35-45 ans", "Nicolas, 45-55 ans", "Sophie, 40-50 ans", "Bénédicte, 40-50 ans", "Noémie, 30-50 ans"], "ages": ["a"]}, {"id": "disperses", "titre": "Dispersés", "famille": "Comédie douce-amère", "genre": "Comédie douce-amère", "duree": 90, "annee": 2026, "comediens": 3, "f": 1, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "3 (1F/2H)", "resume_court": "Trois frères et sœurs que tout oppose se retrouvent autour de l’urne de leur père et partent en Normandie disperser ses cendres. Un dernier voyage qui ravive rancunes, secrets et le vieux besoin de se parler enfin.", "resume": "Le patriarche s’est éteint après une longue maladie. Face à l’urne funéraire, trois héritiers que tout oppose se retrouvent contraints de cohabiter : Philippe, l’aîné éternellement en échec, collectionne les déboires sentimentaux comme d’autres les médailles ; Claire, femme d’affaires redoutable qui a bâti son empire en niant ses émotions ; Nicolas enfin, le benjamin, perdu dans les méandres des théories complotistes et des anxiolytiques. Sans testament, sans consignes, une question obsédante les unit : que faire des cendres paternelles ? Seul point de convergence : rejoindre la Normandie où repose leur mère. Mais ce voyage vers le passé familial va déterrer bien plus que des souvenirs. Entre révélations et règlements de comptes différés, cette fratrie dispersée va-t-elle apprendre à se parler… ou exploser ?", "personnages": ["Philippe, l’aîné, la cinquantaine", "Nicolas, le benjamin, la quarantaine", "Claire, bientôt quarante ans"], "ages": ["a"]}, {"id": "du-bleu-a-l-ame", "titre": "Du Bleu à l'Âme", "famille": "Fable & conte", "genre": "Conte poétique", "duree": 100, "annee": 2002, "comediens": 7, "f": 3, "h": 4, "libre": 0, "roles": null, "modulable": false, "distribution": "7 (3F/4H) + narrateur off", "resume_court": "Dans un cirque isolé au cœur d’une forêt, une troupe de saltimbanques (clowns, funambule, dompteur) vit recluse loin du monde, jusqu’à ce qu’une nuit vienne tout bouleverser.", "resume": "Deux siècles après aujourd’hui, au cœur d’une forêt que personne ne traverse, le cirque de l’Eden vit reclus, chacun de ses artistes voué à la perfection de son numéro. Une nuit, Louise, une jeune fille aux bras écorchés par les branches, tombe évanouie sur la piste. Elle est recueillie par Calvin, un clown qui ne parle qu’en onomatopées, et par Cybelline, le clown blanc. Natanael, le Monsieur Loyal, l’embauche à coups de consignes : lever à six heures, balai et corvées. Autour d’eux, Aden, l’homme le plus fort du monde, Daëlle, la funambule qui se blesse à la cheville, et Volkoff, le dompteur et ses bêtes. Louise apprend à comprendre les mots de Calvin, qui lui effeuille des fleurs imaginaires. Mais son arrivée ranime une vieille fièvre : Daëlle veut profiter de l’automne, quand la forêt s’éclaircit, pour gagner avec Aden les lumières de la Grande Ville, alors que partir est tenu pour une malédiction. Cybelline s’en inquiète auprès de Natanael, qui refuse de voir l’équilibre vaciller, jusqu’au soir de la représentation où son numéro au couteau prend un tour inattendu.", "personnages": ["Calvin, 30-45 ans", "Louise, 18-25 ans", "Cybelline, 30-45 ans", "Natanael, 50-60 ans", "Aden, 30-40 ans", "Daëlle, 20-30 ans", "Volkoff, 40-55 ans"], "ages": ["j", "a"]}, {"id": "du-bon-cote", "titre": "Du bon côté", "famille": "Comédie", "genre": "Comédie politique", "duree": 80, "annee": 2026, "comediens": 6, "f": 3, "h": 3, "libre": 0, "roles": null, "modulable": false, "distribution": "6 (3F/3H) + 5 silhouettes de dos ou en voix, doublables", "resume_court": "Un soir, dans un village de moins de cent habitants, le conseil municipal vote le rattachement à la commune voisine, gagnée par l’extrême droite, mais mieux dotée.", "resume": "", "personnages": ["Martine, 55-65 ans", "Bernard, 60-70 ans", "Daniel, 50-60 ans", "Lucien, 70-80 ans", "Catherine, 40-50 ans", "Lisette, 65-75 ans", "Personnages secondaires, de dos ou en voix : Roger, 93-96 ans ; Madame Lhomme, 70-75 ans ; Bruno, 55-60 ans ; « L’un » et « L’autre », 40-50 ans"], "ages": ["a", "s"], "indispo": true}, {"id": "entre-deux-averses", "titre": "Entre deux averses", "famille": "Fable & conte", "genre": "Fable poétique chorale", "duree": 80, "annee": 2006, "comediens": 10, "f": 3, "h": 6, "libre": 1, "roles": null, "modulable": false, "distribution": "10 rôles (3F/6H + La Pensée H ou F), doublages possibles", "resume_court": "Sous un abri de fortune, par une nuit de pluie, des couples et des solitudes se croisent, veillés par des figures allégoriques (La Pensée, La Mort) qui distillent leurs sentences.", "resume": "Une rue quelconque, la nuit, sous la pluie, la veille de la Saint-Valentin. Au centre, un abri avec un banc, un réverbère qu’on règle à coups de poing, des flaques. La Pensée passe avec son arrosoir et vide son eau sur la tête de ceux qui s’attardent. Sous l’abri défilent Elle et Lui, qui viennent de se dire « je t’aime » et ne savent pas quoi en faire ; Joli cœur, séducteur qui congédie Calvin, un clown triste, puis appelle tout son répertoire pour trouver une fille à emmener au restaurant ; Le Fils, qui raconte sa mère, les saucisses dans la friteuse et sa naissance « tout bleu ». Léandre, confident de tous, reçoit à deux heures du matin les appels de Jules qui attend un texto, et les échecs de Nico, qui fait encore le pied de grue avec une rose et des croissants à trente ans. Et La Mort passe, faux à la main et carnet d’adresses, pour demander son chemin.", "personnages": ["Léandre", "Joli cœur, 30-40 ans", "Lui, 25-35 ans", "Elle, 25-35 ans", "Jules, 25-35 ans", "Nico, 25-35 ans", "Le Fils, 30-40 ans", "Calvin, sans âge", "La Mort, sans âge", "La Pensée, homme ou femme, sans âge"], "ages": ["j", "a"]}, {"id": "entre-deux-chaises", "titre": "Entre deux chaises", "famille": "Fable & conte", "genre": "Fable politique", "duree": 90, "annee": 2015, "comediens": 6, "f": 2, "h": 4, "libre": 0, "roles": null, "modulable": false, "distribution": "6 (2F/4H)", "resume_court": "Chassés de leur village par la guerre, six habitants s’échouent sur une île déserte où traîne une chaise : qui s’y assoit fait plier les autres. Dor, la maire, gagne l’élection et le trône ; Lut, son frère, fait sécession sur un bout de plage, se bâtit sa propre chaise et trace une frontière.", "resume": "Une nuit, des hommes armés entrent dans le village et y mettent le feu. Six habitants fuient dans la barque de Lut et s’échouent, après la tempête, sur une île déserte : Dor, sa sœur, maire élue qui tient à son « Dame Dor », Kra, le tailleur de pierre qui a raté le nez de sa statue, Gig, le poète, Tek, la veuve qui connaît les plantes, et Mis, le boulanger qui ne parle qu’en « j’ai » et demande sans cesse où est le coucou. Sur la plage traîne une chaise : celui qui s’y assoit met tous les autres à genoux. Dor remporte l’élection contre son frère, s’installe sur le trône, entend des voix, dicte ses commandements à Tek sur des tablettes de pierre et interdit de manger les animaux trop mignons. Lut, battu, se retire sur un bout de plage, se construit sa propre chaise avec les restes de son bateau, trace une frontière, braconne sur les terres de sa sœur et dresse un mur de sable, pendant que Gig et Tek se courtisent par-dessus la ligne.", "personnages": ["Lut", "Dor", "Tek", "Gig", "Kra", "Mis", "Tous les âges"], "ages": ["libre"]}, {"id": "etreignez-les-etoiles", "titre": "Étreignez les étoiles", "famille": "Drame & thriller", "genre": "Tragédie", "duree": 80, "annee": 2006, "comediens": 5, "f": 2, "h": 2, "libre": 1, "roles": null, "modulable": false, "distribution": "5 (2F/2H + Personne, homme ou femme)", "resume_court": "Quatre survivants enfermés dans un abri antiatomique, sans savoir ce qui s’est passé au-dessus, se créent un double narrateur pour tenir : creuset de leurs angoisses et de leurs espoirs.", "resume": "Ils sont quatre, enfermés dans un abri antiatomique. Il s’est passé quelque chose au-dessus, mais quoi ? Nul ne le sait, pas même eux. Depuis des jours qu’ils sont ici, n’osant pas sortir, ils se créent un double, Personne, qui devient le narrateur de leur histoire et le creuset de leurs angoisses et de leurs espoirs.", "personnages": ["Palden", "Anohi", "Gail", "Marek, frère de Gail", "Tous les quatre ont une petite vingtaine d’années", "Personne, sans âge ni sexe précis"], "ages": ["j", "a"]}, {"id": "ex-de-la-place-pour-deux-voire-un-peu-plus", "titre": "Chelsea et Archie (et les autres)", "famille": "Comédie", "genre": "Comédie", "duree": 70, "annee": 2020, "comediens": 2, "f": 1, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "2 comédiens (1F/1H), 4 rôles", "resume_court": "Chelsea et Archie, couple new-yorkais, s’apprêtent à devenir parents quand Archie tombe dans le coma et se réveille avec deux personnalités en plus de la sienne.", "resume": "Chelsea et Archie forment un joli couple new-yorkais. Lui essaie de percer dans la musique, sans aucun talent ; elle est journaliste et ne vit que de piges. Ils ont décidé de fonder une famille. Mais à l’annonce de la grossesse, Archie tombe dans le coma, sans autre explication. À son réveil, il se retrouve en « colocation » dans son propre corps avec deux autres personnalités, Anna et Alan. Malgré les traitements, rien n’y fait, et Chelsea doit cohabiter avec tout ce monde : épuisant, d’autant qu’elle accouche dans un mois. Bien décidée à comprendre ce qui se passe dans la tête de son homme, elle l’embarque vers la terre de son enfance, dans le Colorado. Commence alors un road trip dans une vieille camionnette prête à rendre l’âme, entre Archie, plus déprimé que jamais, Alan, qui s’émerveille de tout, et Anna, adolescente bipolaire. Chelsea tient un journal de bord où elle parle à son enfant, et l’enquête sur l’origine du traumatisme d’Archie commence…", "personnages": ["Chelsea, petite trentaine", "Archie, la quarantaine (Anna et Alan joués par le comédien d’Archie)"], "ages": ["a"]}, {"id": "fillettes", "titre": "Fillettes", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 90, "annee": 2024, "comediens": 2, "f": 2, "h": 0, "libre": 0, "roles": null, "modulable": false, "distribution": "2 (2F)", "resume_court": "Chaque mois, Maya quitte Paris et ses abonnées bien-être pour accompagner sa mère à sa chimio. Chaque mois, Marguerite l’attend en chemise de nuit, un mojito à la main, et exige un vrai « bonjour », billet de cinq euros à l’appui. De septembre à janvier, cinq rendez-vous, cinq matchs.", "resume": "Septembre, un appartement d’Annemasse qui a bien vécu. Maya, influenceuse parisienne de « l’alignement vertical » et du code promo « Maya-10 », débarque avec ses courses. Sur la table, elle trouve une bouteille vide et deux verres, dont un sans rouge à lèvres. Marguerite, sa mère, surgit en chemise de nuit et réclame un vrai bonjour, billet de cinq euros à l’appui. Demain, c’est chimio. Marguerite n’a pas touché aux compléments bio de sa fille, a pris le suppositoire pour une gélule, noie son traitement dans des mojitos sans eau gazeuse et appelle tous les chauffeurs Uber Momo. Maya défend la sororité et déclare la guerre au mot « fillette ». D’un mois à l’autre, chaque visite tourne au match : une joute sur le « néo » féminisme, une Mère Noël à barbe, une camionneuse qui se présente sur le palier. Et chaque fois, en partant, Maya laisse une enveloppe sur la table.", "personnages": ["Maya, 25 ans", "Marguerite, sa mère, environ 55 ans"], "ages": ["j", "a"]}, {"id": "histoire-d-ames-premier-etage", "titre": "Histoire d'âmes, Premier étage", "famille": "Saynètes & recueils", "genre": "Recueil de saynètes", "duree": 90, "annee": 2000, "comediens": null, "f": null, "h": null, "libre": 0, "roles": null, "modulable": true, "distribution": "Distribution variable", "resume_court": "Recueil de saynètes écrites et jouées entre 1998 et 2000, centrées sur Juliette : la solitude, l’absurde, et la vie qui s’obstine malgré tout.", "resume": "Un banc au centre, une sortie à jardin, une à cour : le même meuble devient tour à tour banc public, canapé ou toit d’immeuble. Les saynètes se jouent dans l’ordre qu’on veut, mais un fil les traverse : Juliette, célibataire « bien en forme » qui se présente au public en se tordant les mains et crie « Roméo ! » à chaque coup de déprime. On la retrouve heureuse, au quotidien, puis montant seule à l’abordage du vaisseau L’Amour, capitaine, vigie et second à la fois, l’épée à la main sur son canapé. Autour d’elle, d’autres âmes en vrac : dans « Double psy », une fille et un garçon, chacun allongé chez son psy, décrivent la même rencontre à l’unisson ; dans « Nos maris », deux femmes sur un banc comparent leurs époux jusqu’à cogner dans le vide ; dans « Un homme à la fenêtre », Alain atterrit devant Édouard, éjecté par Sally du premier étage ; dans « Le saut, mon ange », François s’apprête à sauter d’un toit de six étages quand Jacob vient s’accouder à côté de lui.", "personnages": ["Juliette et d’autres personnages, de tous âges (saynètes)"], "edite": true, "ages": ["libre"], "editeur": "Éclats d’encre"}, {"id": "histoire-d-ames-version-augmentee", "titre": "Histoire d'âmes, version augmentée", "famille": "Saynètes & recueils", "genre": "Recueil de saynètes", "duree": 90, "annee": 2018, "comediens": null, "f": null, "h": null, "libre": 0, "roles": null, "modulable": true, "distribution": "Distribution variable", "resume_court": "Le recueil Histoire d’âmes, augmenté d’une dizaine de textes inédits pour ses dix-huit ans : Juliette, ses « Roméo ! » et les autres âmes en vrac.", "resume": "Dix-huit ans après sa première édition, Histoire d’âmes revient augmenté d’une dizaine de textes supplémentaires. Toujours un banc au centre, une sortie à jardin, une à cour : le même meuble devient tour à tour banc public, canapé ou toit d’immeuble, et les saynètes se jouent dans l’ordre qu’on veut. Le fil reste Juliette, célibataire « bien en forme » qui se tord les mains devant le public et crie « Roméo ! » à chaque coup de déprime, avant de monter seule à l’abordage du vaisseau L’Amour, l’épée à la main sur son canapé. Autour d’elle, d’autres âmes en vrac : deux patients qui racontent la même rencontre chacun chez son psy, deux femmes qui comparent leurs maris sur un banc, un homme éjecté d’un premier étage, un autre au bord d’un toit quand un inconnu vient s’accouder à côté de lui.", "personnages": ["Juliette et d’autres personnages, de tous âges (saynètes)"], "edite": true, "ages": ["libre"], "editeur": "Éditions À propos"}, {"id": "j-ai-longtemps-porte-les-robes-de-maman", "titre": "J'ai longtemps porté les robes de Maman", "famille": "Seul-en-scène", "genre": "Seul-en-scène", "duree": 60, "annee": 2017, "comediens": 1, "f": 0, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "1 (1H)", "resume_court": "Nicolas raconte son homosexualité, sa famille et sa quête de reconnaissance, de l’enfance à l’âge adulte.", "resume": "Nicolas a longtemps porté les robes de sa mère, surtout la violette, qu’elle jurait lilas. Du fauteuil de son dentiste à la barre d’un tribunal où la robe elle-même vient se défendre, il rejoue sa vie : une mère flamboyante qui usait les hommes et ne le prenait jamais dans ses bras, un père chasseur à qui il annonce qu’il aime les hommes, un karaoké entre copines, une nuit en boîte qui tourne au film d’horreur, deux minutes d’attente dans un centre de dépistage, l’enterrement d’un vieux comédien client de son agence, quatre homophobes à qui il donne un cours de tabassage, une demande en mariage avec un emballage de chewing-gum en guise de bague, une fille conçue avec une amie et élevée à trois.", "personnages": ["Nicolas grandit et vieillit au fil de la pièce : l’âge du comédien n’a pas d’importance"], "ages": ["libre"]}, {"id": "je-vous-ai-presque-compris", "titre": "Je vous ai (presque) compris", "famille": "Comédie douce-amère", "genre": "Comédie douce-amère", "duree": 90, "annee": 2026, "comediens": 6, "f": 4, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "6 (4F/2H)", "resume_court": "Consultante venue liquider l’héritage d’un père kabyle qu’elle connaissait à peine, Élodie découvre une maison habitée par ceux qui l’aimaient, et se fait passer, par un malentendu qu’elle n’ose pas démentir, pour l’envoyée du notaire.", "resume": "", "personnages": ["Élodie, 33 ans", "Camille, enceinte, 25-30 ans", "France, 55-65 ans", "Paul, la quarantaine", "Marc, 40-55 ans", "Isabelle, 45-55 ans"], "ages": ["j", "a", "s"], "indispo": true}, {"id": "jeanne-blum-l-heroisme-silencieux", "titre": "Jeanne Blum, l'héroïsme silencieux", "famille": "Drame & thriller", "genre": "Drame historique et biographique", "duree": 90, "annee": 2025, "comediens": 5, "f": 2, "h": 3, "libre": 0, "roles": 14, "modulable": false, "distribution": "14 rôles pour 5 comédiens (2F/3H)", "resume_court": "Amoureuse depuis ses seize ans de Léon Blum, Jeanne le rejoint jusqu’à Buchenwald et veille sur lui envers et contre tout.", "resume": "1981. Jeanne Blum, au crépuscule de sa vie, confie à Pierre Mauroy l’épopée de son amour pour Léon Blum. Adolescente quand elle le rencontre, Jeanne traversera l’Histoire avec la certitude que rien ne l’empêchera de s’unir à lui. Pendant que Léon devient la figure emblématique du Front populaire, Jeanne se marie deux fois et vit l’entre-deux-guerres dans toute son effervescence. Aux côtés d’Andrée, son amie aux mœurs libres, elle s’initie aux milieux politiques que fréquente Léon. Sous l’Occupation, refusant l’exil, elle choisit de rester près de Blum, traqué par le régime de Pétain, et le suit de prison en prison. Quand il est envoyé à Buchenwald en 1943, Jeanne arrache à Pierre Laval sa propre déportation volontaire. Dans le camp, elle épouse Léon devant un officier allemand, acte suprême de résistance. Durant deux ans de captivité, elle devient son rempart contre la mort, jusqu’à leur libération en 1945.", "personnages": ["Jeanne, de 15 à 80 ans (1915-1981)", "14 rôles historiques pour 5 comédiens (2F/3H) : Léon Blum, Andrée, Pierre Mauroy, Pierre Laval…, de 25 à 75 ans"], "ages": ["j", "a", "s"]}, {"id": "joyeux-anniversaire-quand-meme", "titre": "Joyeux anniversaire quand même", "famille": "Comédie romantique", "genre": "Comédie romantique", "duree": 90, "annee": 2006, "comediens": 2, "f": 1, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "2 (1F/1H)", "resume_court": "Olivier, jeune quadra fermé à double tour, doit héberger une semaine Loulou, aussi déjantée que terriblement vivante.", "resume": "Olivier, un quadra bien décidé à ne plus ouvrir son cœur, se voit obligé d’héberger pendant une semaine Loulou, une jeune femme aussi déjantée que terriblement vivante. Cadeau empoisonné ou opportunité d’un nouveau départ ?", "personnages": ["Olivier, la quarantaine", "Loulou, la quarantaine"], "edite": true, "ages": ["j", "a"], "editeur": "Éclats d’encre"}, {"id": "juste-ce-qu-il-faut-de-bagages", "titre": "Juste ce qu'il faut de bagages", "famille": "Comédie", "genre": "Comédie", "duree": 80, "annee": 2023, "comediens": 3, "f": 1, "h": 2, "libre": 0, "roles": 8, "modulable": false, "distribution": "8 rôles pour 3 comédiens (1F/2H)", "resume_court": "Nelly apprend que son père n’était pas son père, et part dans les Landes avec son demi-frère Lionel régler l’héritage d’un géniteur inconnu.", "resume": "Nelly, jeune retraitée, apprend que son père est mort. Problème : il est déjà mort, avec sa mère, il y a vingt ans ! En réalité, il s’agit de son père biologique, qui lui a légué sa maison dans les Landes… Aidée de Lionel, son frère devenu demi-frère, elle part à Tarnos. Là, ils rencontrent Christian, qui va les épauler dans leur quête de vérité. Mais l’héritage va se révéler un peu plus compliqué que prévu !", "personnages": ["Nelly, jeune retraitée, 60-65 ans", "Lionel, son demi-frère, 60-70 ans", "Christian, 55-65 ans", "Rôles partagés par les deux comédiens : le notaire, René, un livreur, un propriétaire, un passant"], "ages": ["a", "s"]}, {"id": "l-effet-papillon", "titre": "L'effet Papillon", "famille": "Comédie", "genre": "Comédie satirique", "duree": 90, "annee": 2024, "comediens": 5, "f": 2, "h": 3, "libre": 0, "roles": null, "modulable": false, "distribution": "5 (2F/3H)", "resume_court": "Sylvain, en pleine ascension politique, vient de défendre à la radio le choix de ne pas avoir d’enfants. En rentrant, il trouve sur son canapé Rémi, trente ans, qui l’appelle papa. Rémi a trois jours. Madeleine l’adopte comme une évidence, ses parents débarquent, et le fils tombé du ciel devient un argument de campagne.", "resume": "", "personnages": ["Madeleine, la quarantaine", "Sylvain, la quarantaine", "Rémi, entre 25 et 30 ans", "Jacques, 70 ans", "France, 60 ans"], "ages": ["j", "a", "s"], "indispo": true}, {"id": "l-espace-d-une-seconde", "titre": "L'espace d'une seconde", "famille": "Comédie", "genre": "Comédie fantaisiste", "duree": 80, "annee": 2022, "comediens": 6, "f": 3, "h": 3, "libre": 0, "roles": null, "modulable": false, "distribution": "6 (3F/3H)", "resume_court": "Pour ses quarante ans, Jérôme reçoit la visite de Casper, un messager de la mort pas franchement au point, venu lui annoncer son décès imminent devant toute sa famille.", "resume": "Jérôme fête ses 40 ans ce dimanche. Quelques amis et un peu de famille sont là pour l’aider à franchir ce cap qu’il ne redoute pas trop, lui qui se sent plutôt immortel. Nathalie, sa compagne, toujours très stressée, en fait trop et cherche à tout contrôler. Sa mère, Douna, qui a toujours voulu que son fils épouse son judaïsme, n’a de cesse de lui réclamer des petits-enfants, parce qu’elle ne sera pas éternelle. Lucie, sa collègue à l’assurance-vie et sa maîtresse de longue date, lassée des miettes d’intimité qu’il lui accorde, est elle aussi de la partie. Quant à Grégoire, son ami d’enfance, à la ramasse depuis sa rupture et shooté aux antidépresseurs, il est toujours à l’ouest. Une belle journée. Du moins, jusqu’à ce que Jérôme reçoive sur son téléphone une notification lui annonçant sa mort imminente. Passé l’incrédulité, voilà la Mort elle-même qui débarque pour le chercher, dans la peau de Casper… un stagiaire en formation, pas tout à fait prêt pour sa première mission. Commence une grande aventure dominicale, faite de marchandages, de craintes et de révélations. Cette mort 2.0, annoncée à l’avance, va-t-elle faire des émules ?", "personnages": ["Jérôme, 40 ans", "Nathalie, sa compagne, 35-45 ans", "Douna, sa mère, 65-75 ans", "Lucie, sa maîtresse, 35-45 ans", "Grégoire, ami d’enfance, 40 ans", "Casper, la Mort en personne, sans âge"], "ages": ["a", "s"]}, {"id": "l-exhistoire", "titre": "L'Exhistoire", "famille": "Saynètes & recueils", "genre": "Recueil de saynètes", "duree": 80, "annee": 2001, "comediens": null, "f": null, "h": null, "libre": 0, "roles": null, "modulable": true, "distribution": "Troupe modulable", "resume_court": "Un cercle de compères, réunis comme en thérapie de groupe, se racontent tour à tour leurs petites hontes et leurs grandes détresses.", "resume": "Des chaises en arc de cercle, une infirmière au centre, et des comédiens qui hésitent à parler : le cercle de « l’Exhistoire », un exutoire à histoires, attend que quelqu’un se lance. Un volontaire finit par s’avancer, et chaque récit devient une saynète, séparée par un noir et quelques draps pour changer de décor. Armand, à moitié nu, scrute son caleçon pendant que Laly attend dans le lit. Une dame qui veut aimer son prochain se fait rembarrer par un SDF, ses enfants et la guichetière. À SOS Amitié, une seule standardiste joue toutes les écoutantes, de la blasée à pire. Denis, au tribunal, plaide qu’il hait les femmes, et les hommes aussi. Trois femmes sabrent le champagne : Estelle a mis cinq coups de marteau à venir à bout de son mari. Bernard, pavillon, voiture et canapé achetés à crédit par sa femme, voit un Narrateur lui proposer deux suites possibles à sa vie. Le rire se fait de plus en plus noir à mesure que le cercle se vide.", "personnages": ["Personnages de tous âges (saynètes)"], "ages": ["libre"]}, {"id": "l-homme-qui-courait-sur-les-recifs", "titre": "L'Homme qui courait sur les récifs", "famille": "Comédie douce-amère", "genre": "Comédie douce-amère", "duree": 70, "annee": 2004, "comediens": 2, "f": 1, "h": 1, "libre": 0, "roles": 4, "modulable": false, "distribution": "4 personnages pour 2 comédiens (1F/1H)", "resume_court": "Sur un récif, la nuit, Gabriel, écrivain de trente ans, retrouve Rafaèle, devenue mère de famille, et voit revenir leurs doubles de vingt ans : les étés du pèlerinage entre amis, les baisers annuels.", "resume": "Un récif de rocailles brunes, la nuit, après un dîner entre anciens amis. Gabriel, la trentaine, écrivain qui a disparu des années, s’isole sur le plus haut rocher pendant que Dominique vomit dans son coin. Rafaèle, désormais mère de famille, quelques cheveux blancs portés fièrement, vient le chercher : elle a lu tous ses livres et veut savoir pourquoi il est revenu. Pendant qu’ils se parlent, leurs doubles de vingt ans réapparaissent derrière eux et rejouent les étés du « pèlerinage » annuel de la bande : le premier soir où Rafaèle ne retient même pas son nom, l’été où elle vient pour la première fois sans sa mère, la nuit où Gabriel, ivre de vodka, hurle sur le récif qu’il est heureux, puis le cinquième été. Au présent, entre des pompes comptées à voix haute et un genou écorché soigné à la trousse de secours, Gabriel tourne autour du livre qu’il a tiré de cette histoire.", "personnages": ["Gabriel, une trentaine d’années", "Rafaèle, une trentaine d’années", "Gabriel et Rafaèle jeunes (mêmes comédiens, voix off ou projection)"], "edite": true, "ages": ["j", "a"], "editeur": "Éclats d’encre"}, {"id": "l-homme-tordu-peines-perdues", "titre": "L'Homme Tordu", "famille": "Saynètes & recueils", "genre": "Recueil de monologues", "duree": 60, "annee": 2009, "comediens": null, "f": null, "h": null, "libre": 0, "roles": null, "modulable": true, "distribution": "Modulable", "resume_court": "Recueil de monologues et scènes à deux, écrits au rythme d’un texte par mois pendant deux ans, où un narrateur velléitaire rêve inlassablement de l’exceptionnel qui ne lui arrivera jamais.", "resume": "Décembre 2009, un auteur boucle une année où il s’est imposé d’écrire au moins une pièce par mois, et rassemble ce que deux ans de blog ont laissé : soixante-dix fragments sans titres, séparés par des astérisques. Le fil rouge tient en une voix, celle d’un homme qui a toujours attendu qu’il lui arrive un truc grand et qui s’en tient à l’écrire, et en une injonction, « Écris », lancée par celle qui partage son lit. Les scènes à deux reviennent au même décor, un rez-de-chaussée, un matin de pluie, une fille qui repart : l’une le cueille au réveil d’un « Qu’est-ce qu’on a fait cette nuit ? », une autre tombe sur son cahier et demande s’il écrit sur elle, une troisième se plante devant la photo d’une absente qui vit encore dans l’appartement. Entre elles, des monologues et des éclats de quelques lignes : la voiture de nuit et les pointillés blancs avalés par les roues, la pointure trop commune au rayon des soldes, « Tout ce talent, ça va pas peser lourd face à une tumeur maligne ».", "personnages": ["Personnages de tous âges (monologues et duos)"], "ages": ["libre"]}, {"id": "la-coulee-douce", "titre": "La Coulée Douce", "famille": "Comédie douce-amère", "genre": "Comédie douce-amère", "duree": 100, "annee": 2003, "comediens": 6, "f": 3, "h": 3, "libre": 0, "roles": null, "modulable": false, "distribution": "6 (3F/3H)", "resume_court": "Le jour de sa veillée funèbre, Nataniel, écrivain athée, découvre qu’on lui a menti : il est mort, mais toujours là. Autour de son corps se retrouvent ses vieux amis, Valentin, parti sans laisser d’adresse, Pierre, cadre rigide, sa femme Myriam, dépressive, Mathilde, la sœur de Myriam, enceinte de huit mois, et Candice, l’étudiante à qui il a légué sa maison.", "resume": "Une maison de campagne, le jour de la veillée funèbre de Nataniel, écrivain dans la quarantaine. Athée convaincu, il constate qu’on lui a menti sur l’au-delà : il est mort, mais toujours là, à commenter la cérémonie. Myriam, dépressive tout en noir, voilette comprise, arrive avec Pierre, son mari cadre, qui lui trouve une tenue de génocide plutôt que de deuil. Mathilde, sa sœur, infirmière enceinte de huit mois, fume en répétant « oui Myriam ». Valentin, l’ami de fac parti sans laisser d’adresse, débarque sur la foi d’une lettre et découvre sur place qui est mort. Candice, une étudiante trop colorée pour l’occasion, gère tout : Nataniel lui a légué la maison. Entre le corps exposé dans la petite chambre, le discours improvisé de Pierre au cimetière et les petits fours, les vieux comptes remontent : l’amour ancien de Valentin et Mathilde, le départ des deux hommes, les cachets de Myriam. Et Nataniel commente.", "personnages": ["Nataniel, dans la quarantaine", "Valentin, proche de la quarantaine", "Pierre, quarante ans", "Mathilde, trente ans", "Myriam, sœur de Mathilde, la quarantaine", "Candice, la vingtaine"], "edite": true, "ages": ["j", "a"], "editeur": "Éclats d’encre"}, {"id": "la-generale", "titre": "La Générale", "famille": "Comédie", "genre": "Comédie", "duree": 90, "annee": 2017, "comediens": 6, "f": 3, "h": 3, "libre": 0, "roles": null, "modulable": false, "distribution": "6 (3F/3H)", "resume_court": "New York, fin des années cinquante : un grand écrivain convoque famille et proches pour répéter… ses propres funérailles.", "resume": "New York, fin des années 50. Bruce Tanner, grand écrivain, a réuni famille et proches pour leur faire répéter un grand événement : ses funérailles ! La démesure du bonhomme, à la hauteur de son talent, va en déstabiliser plus d’un et faire éclater quelques vérités pour le moins cocasses !", "personnages": ["Bruce Tanner, 60-70 ans", "Jules, Sally, Willy, Morgane et Jay, sa famille et ses proches : de 25 à 60 ans"], "ages": ["a", "s"]}, {"id": "la-lumiere-a-tous-les-etages", "titre": "La Lumière à tous les étages", "famille": "Seul-en-scène", "genre": "Seul-en-scène", "duree": 60, "annee": 2021, "comediens": 1, "f": 0, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "1 (1H)", "resume_court": "Henri se découvre plongé dans le coma sans savoir ni pourquoi ni comment, et doit remonter le fil de sa mémoire (amours ratées, indécisions, lâchetés) pour trouver le chemin du réveil.", "resume": "« Y’a quelqu’un ? » Ce sont les premiers mots d’Henri, entrant sur scène dans le noir le plus complet. Très vite, deux autres personnages viennent éclairer sa lanterne : il est dans le coma, à l’hôpital. En revanche, il ne sait ni pourquoi, ni comment il en est arrivé là ! Commence alors un long parcours à l’intérieur de sa conscience. Remontant le cours de sa mémoire, de ses premiers amours contrariés au souvenir de sa mère, jusqu’à toutes les situations rocambolesques qu’il a dû affronter avec son indécision maladive, Henri doit jongler avec ses failles s’il veut se réveiller. Dans ce récit aussi initiatique que drolatique, il lui faudra beaucoup d’humour et une sacrée dose de courage pour se regarder en face.", "personnages": ["Henri, 50 ans, qui joue aussi tous les autres : L’Autre, Elle, Alice, Emma, sa mère, son père, saint Pierre, La Joie, L’Alcool…"], "ages": ["a"]}, {"id": "la-tete-dans-le-mur", "titre": "La tête dans le mur", "famille": "Comédie", "genre": "Comédie", "duree": 90, "annee": 2009, "comediens": 4, "f": 4, "h": 0, "libre": 0, "roles": null, "modulable": false, "distribution": "4 (4F)", "resume_court": "Une chambre d’hôtel, l’enterrement de vie de jeune fille de Sally, et autour d’elle : Lyneth la psy, Annie sous antidépresseurs, et Raphaëlle, en pleine transition, qui partage le sang de Lyneth et le passé de la mariée. Après une nuit dont personne ne se souvient, il faut recoller les morceaux.", "resume": "Un enterrement de vie de jeune fille qui part avec deux défections : Charlotte et Sandrine se décommandent le matin même, et la chambre d’hôtel réservée par Lyneth paraît soudain bien grande. Lyneth est psy et doute de son propre couple. Sally se marie avec Patrice après six ans. Annie, qui tape dans ses mains et répète tout trois fois, vient d’apprendre que Jean-Christophe la trompe et écrase ses antidépresseurs dans le muscat. Et puis il y a Raphaëlle, du même sang que Lyneth, en pleine transition, sous œstrogènes, qui a supplié pour venir : c’est pour Patrice que Sally est partie. Raphaëlle a préparé « des petites surprises » et tout le monde se méfie. Après une nuit noyée, le réveil : Raphaëlle a un œil au beurre noir et un sabre sous Annie, Lyneth un tatouage « Princesse » dans le cou, Sally une robe de mariée qui n’est pas la sienne et le souvenir d’un gros barbu en slip qui s’est servi dans son sac. Entre les monologues sur la foi, les comptes se règlent.", "personnages": ["Raphaëlle", "Lyneth", "Sally", "Annie", "Toutes les quatre ont la trentaine"], "ages": ["a"]}, {"id": "la-vie-est-une-fete", "titre": "La vie est une fête !", "famille": "Comédie dramatique", "genre": "Comédie dramatique", "duree": 90, "annee": 2019, "comediens": 5, "f": null, "h": null, "libre": 0, "roles": 16, "modulable": false, "distribution": "16 rôles (7F/8H + le Temps qui passe) pour 5 comédiens", "resume_court": "Romain est né un 1er janvier : chaque réveillon est aussi son anniversaire. Nuit du Nouvel An 2019, il raconte sa vie de réveillon en réveillon, entre une mère qui voulait une fille, un père pour qui « pleurer, c’est pour les pédés » et l’Histoire de France qui passe à la télé.", "resume": "Romain a eu la mauvaise idée de naître par le siège, un 1er janvier 1973, alors que sa mère voulait une fille. Depuis, chaque réveillon est aussi son anniversaire. C’est de réveillon en réveillon qu’il se raconte, le soir du Nouvel An 2019, dans le jardin de la maison de ses parents. Il y a le père boulanger, qui lui offre sa première platine et lui apprend que « pleurer, c’est pour les pédés ». Il y a la mère, qui trinque au Tranxène entre deux cures. Il y a Christophe, le meilleur copain hétéro, et Becca, le premier baiser raté, qui finira Femen. Il y a Alan, le photographe plus âgé, en 1993, et Martin, qui veut l’épouser en 2013. À la télé défilent Simone Veil, Hervé Guibert et le bug de l’an 2000. Romain ne s’est jamais voulu militant, et pourtant on lui refuse le droit de donner son sang. Quand le Temps qui passe en personne se met à commenter sa vie, il serait peut-être temps de savoir où l’attend l’amour.", "personnages": ["Romain, la quarantaine", "Rôles partagés par les quatre autres comédiens : Becca, le père, la mère, Christophe, Alan, Élise, Martin, Sophie, une infirmière, Gérard, Marie, Simone Veil, Patrice Cardon, Hervé Guibert, Le Temps qui passe"], "edite": true, "ages": ["a", "s", "j"], "editeur": "L’Avant-Scène Théâtre"}, {"id": "lavage-delicat", "titre": "Lavage délicat", "famille": "Comédie douce-amère", "genre": "Comédie douce-amère", "duree": 70, "annee": 2004, "comediens": 2, "f": 1, "h": 1, "libre": 0, "roles": null, "modulable": false, "distribution": "2 (1F/1H)", "resume_court": "Lou et Elliot remontent, en flash-back, le fil d’une histoire d’amour qu’on devine déjà abîmée.", "resume": "Lou et Elliot sont prêts à se donner l’un à l’autre. Et pourtant, ça ne va pas être si simple… ce serait trop simple. Parce qu’il faut se remémorer toutes les étapes qui les ont menés jusqu’ici, et parce qu’il est de bon usage, en amour, de parler avant de toucher… eh bien, on n’est pas rendus.", "personnages": ["Lou, la trentaine", "Elliot, la trentaine"], "edite": true, "ages": ["a"], "editeur": "Éclats d’encre"}, {"id": "le-chut-de-l-histoire", "titre": "Le Chut de l'histoire", "famille": "Fable & conte", "genre": "Fable", "duree": 90, "annee": 2016, "comediens": 5, "f": 3, "h": 2, "libre": 0, "roles": null, "modulable": false, "distribution": "5 (3F/2H)", "resume_court": "Cinq personnages atterrissent sur un plateau couvert de cartons, une sorcière, une princesse, une indécise, un poète réduit au mime et un brouillon qui ne dit que « Hmmm ». On les a convoqués sans texte. Pour ne pas s’effacer, ils partent à la chasse au premier mot.", "resume": "Une scène encombrée de cartons, un silence, puis tout explose : cinq personnages atterrissent en vrac sur le plateau. Eva, sorcière qui déteste la gentillesse, dégaine sa baguette ; Ninie, princesse sortie d’un conte, court après tout le monde avec son couteau ; Debbie, incapable de choisir entre une vodka o
