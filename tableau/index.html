<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Les 99 pièces de théâtre de Lilian Lloyd, sur son bureau.">
<title>Le Tableau du répertoire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Permanent+Marker&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout : photo d'un bureau vu de haut ; sur la feuille, neuf genres écrits à la main, chacun avec sa liste de pièces griffonnée dessous. Vue d'ensemble = on lit les genres ; clic = zoom sur le coin de page du genre */
:root{
  --ink:#24211F; --graphite:#57524D; --bordeaux:#7A1F2B; --blue:#2B4A86; --green:#2E5E4E;
  --note:#FBF8F1; --hl:rgba(255,224,90,.6);
  --f-marker:"Permanent Marker","Comic Sans MS",cursive;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --f-text:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{margin:0;background:#1C130D;color:var(--ink);font-family:var(--f-text)}
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;background:#1C130D}
#stage.drag{cursor:grabbing}
#board{position:absolute;left:0;top:0;transform-origin:0 0}
#photo{position:absolute;left:0;top:0;pointer-events:none;user-select:none;display:block;max-width:none}
#carve{position:absolute;left:0;top:0;pointer-events:none}
#ink{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;mix-blend-mode:multiply}
#paper{position:absolute;left:0;top:0;mix-blend-mode:multiply}
.cell{position:absolute}
.cell.ov{cursor:zoom-in}
.cell.ov .li{opacity:.3}
.cell.ov .nt,.cell.ov .ghost{opacity:0;pointer-events:none}
.nt,.ghost{transition:opacity .3s}
body.ov .hubn{opacity:0!important}
body.ov path.ln{opacity:.12!important}
.hubn{transition:opacity .3s}
.gl{position:absolute;font-family:var(--f-marker);color:var(--c);white-space:nowrap;transform:rotate(var(--r));cursor:pointer;line-height:1;padding:6px 10px;background:none;border:0;transition:transform .15s}
.gl:hover,.gl:focus-visible{transform:rotate(var(--r)) scale(1.06);outline:none}
.gl:focus-visible{background:rgba(255,224,90,.35)}
.gl small{font-family:var(--f-hand);font-weight:500;font-size:.55em;color:var(--graphite);margin-left:.35em}
.gl svg{position:absolute;left:-4%;bottom:-14px;width:108%;height:26px;overflow:visible}
.li{position:absolute;white-space:nowrap;font-family:var(--f-hand);font-weight:700;color:var(--c);text-decoration:none;line-height:1;padding:3px 5px;transform:rotate(var(--r));transition:opacity .25s,transform .12s;opacity:.55}
.cell.open .li{opacity:1;animation:write .5s ease-out both;animation-delay:var(--dl)}
.cell.open .li.x{opacity:.55}
.li:hover,.li:focus-visible{transform:rotate(var(--r)) scale(1.07);background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 90%,transparent 90%);outline:none}
.li .nd{font-weight:500;font-size:.55em;color:var(--graphite);margin-left:.35em}
.ghost{position:absolute;white-space:nowrap;font-family:var(--f-hand);font-weight:500;color:#8C847C;transform:rotate(var(--r));pointer-events:none}
.ghost s{text-decoration:none;background:linear-gradient(transparent 50%,#8C847C 50%,#8C847C 60%,transparent 60%)}
.ghost i{font-style:normal;font-size:.8em;margin-left:.3em}
.nt{position:absolute;white-space:nowrap;font-family:var(--f-hand);font-weight:500;color:#7A736B;transform:rotate(var(--r));cursor:default;padding:2px 5px;transition:color .15s,background .15s}
.nt svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;transition:opacity .2s}
.nt:hover,.nt.on{color:var(--ink);background:linear-gradient(transparent 30%,var(--hl) 30%,var(--hl) 92%,transparent 92%)}
.nt:hover svg,.nt.on svg{opacity:.2}
.hubn{position:absolute;font-family:var(--f-hand);font-weight:700;color:var(--blue);white-space:nowrap;transform:rotate(var(--r));pointer-events:none;opacity:.85}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
body.focus .li:not(.lit){opacity:.18!important}
body.focus path.ln:not(.lit){opacity:.12}
path.ln{transition:opacity .2s}
path.lit{stroke-width:4;opacity:1!important}
.hud{position:fixed;z-index:5;font-family:var(--f-text)}
#head{left:16px;top:calc(14px + env(safe-area-inset-top,0px));background:#F7E9A8;padding:12px 18px 10px;transform:rotate(-2deg);box-shadow:0 6px 14px rgba(0,0,0,.4);max-width:min(390px,calc(100vw - 32px))}
#head .n{font-family:var(--f-marker);font-size:25px;color:var(--bordeaux);line-height:1.05}
#head .s2{font-family:var(--f-hand);font-size:21px;margin-top:2px}
#head .s2 b{color:var(--bordeaux)}
#tools{right:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.btn{font-family:var(--f-hand);font-weight:700;font-size:19px;color:var(--ink);background:var(--note);border:2px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:4px 14px;text-decoration:none;cursor:pointer;line-height:1.2;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.btn:hover,.btn:focus-visible{color:var(--bordeaux);border-color:var(--bordeaux);outline:none}
.btn.pri{background:var(--bordeaux);color:var(--note);border-color:var(--bordeaux)}
.btn.pri:hover{color:var(--note);filter:brightness(1.12)}
#back{left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%) rotate(-1deg);font-size:22px}
#hint{left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));font-family:var(--f-hand);font-size:19px;color:#F1E6D4;background:rgba(30,20,12,.8);padding:3px 14px;border-radius:20px;white-space:nowrap}
#card{position:fixed;z-index:6;width:min(340px,calc(100vw - 32px));background:var(--note);padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.45);border-top:4px solid var(--bordeaux)}
#card .k{font-family:var(--f-hand);font-size:17px;color:var(--bordeaux)}
#card h2{font-family:var(--f-text);font-weight:600;font-size:23px;line-height:1.15;margin:2px 0 6px;text-wrap:balance}
#card .m{font-size:16px;font-style:italic;color:#5b524a;margin-bottom:6px}
#card p{margin:0 0 8px;font-size:17px;line-height:1.4}
#card .w{font-family:var(--f-hand);font-size:18px;color:var(--bordeaux)}
#card a.go{font-family:var(--f-hand);font-weight:700;font-size:20px;color:var(--bordeaux)}
@media (max-width:700px){#head .n{font-size:21px}#head .s2{font-size:18px}.btn{font-size:16px;padding:3px 10px}#hint{font-size:16px}
  #tools{top:auto;bottom:calc(52px + env(safe-area-inset-bottom,0px));left:16px;right:auto;justify-content:flex-start}#back{top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px))}}

/* téléphone : la feuille se lit de haut en bas, un genre par ligne, on touche pour déplier */
#mob{display:none}
@media (max-width:700px){
  #stage{display:none}
  #mob{display:block;position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#1C130D url(bureau.jpg) 22% 50%/cover no-repeat;padding:calc(110px + env(safe-area-inset-top,0px)) 14px calc(130px + env(safe-area-inset-bottom,0px))}
  #mob::before{content:"";position:fixed;inset:0;background:rgba(20,12,6,.35);pointer-events:none}
  #mob .sheet{position:relative;background:#F8F3EA;padding:18px 18px 26px;transform:rotate(-.6deg);box-shadow:0 14px 36px rgba(0,0,0,.55);background-image:repeating-linear-gradient(transparent 0 33px,rgba(43,74,134,.10) 33px 34px)}
  #mob .g{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 4px 6px;font-family:var(--f-marker);font-size:27px;line-height:1.1;color:var(--c);cursor:pointer;transform:rotate(var(--r))}
  #mob .g small{font-family:var(--f-hand);font-size:.62em;color:var(--graphite);margin-left:.3em}
  #mob .g::after{content:"";display:block;height:3px;width:var(--u);background:currentColor;border-radius:3px;margin-top:3px;opacity:.75}
  #mob .lst{display:none;padding:2px 0 12px 10px}
  #mob .grp.open .lst{display:block}
  #mob .lst a{display:block;font-family:var(--f-hand);font-weight:700;font-size:23px;line-height:1.25;color:var(--c);text-decoration:none;padding:3px 2px;transform:rotate(var(--r))}
  #mob .lst a.x{opacity:.55}
  #mob .lst a .nd{font-weight:500;font-size:.6em;color:var(--graphite);margin-left:.3em}
  #mob .lst .nt2{font-family:var(--f-hand);font-size:19px;color:#7A736B;text-decoration:line-through;padding:2px}
  #card{left:12px!important;right:12px;top:auto!important;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto}
  #hint{display:none}
}
/* « Recherche détaillée » : un post-it qui gigote toutes les six secondes pour qu'on le remarque */
.btn.cherche{background:#F7E9A8;display:flex;flex-direction:column;align-items:center;line-height:1.1;padding:5px 14px 6px}
.btn.cherche small{font-weight:500;font-size:15px;color:var(--graphite)}
@keyframes gigote{0%,82%,100%{transform:rotate(0) scale(1)}85%{transform:rotate(-7deg) scale(1.12)}88%{transform:rotate(6deg) scale(1.12)}91%{transform:rotate(-4deg) scale(1.08)}94%{transform:rotate(2deg) scale(1.04)}97%{transform:rotate(-1deg) scale(1)}}
@media (prefers-reduced-motion:no-preference){.btn.cherche{animation:gigote 6s ease-in-out 1.5s infinite}.btn.cherche:hover,.btn.cherche:focus-visible{animation:none;transform:scale(1.08)}}
@media (max-width:700px){.btn.cherche small{font-size:13px}}
@media (prefers-reduced-motion:reduce){.cell.open .li{animation:none}}
</style>

</head>
<body>
<div id="stage" aria-label="Le répertoire sur le bureau">
  <div id="board">
    <img id="photo" alt="" src="bureau.jpg">
    <canvas id="carve"></canvas>
    <svg id="ink" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="paper"></div>
  </div>
</div>
<div id="mob" aria-label="Le répertoire, genre par genre"><div class="sheet" id="sheet"></div></div>
<div class="hud" id="head"><div class="n">le répertoire sur mon bureau</div><div class="s2"><b id="nb">99</b> pièces, servez-vous</div></div>
<nav class="hud" id="tools" aria-label="Navigation">
  <a class="btn cherche" href="https://lilianlloyd.github.io/repertoire/">Recherche détaillée<small>par nombre de comédiens, âge, durée…</small></a>
  <a class="btn pri" href="https://lilianlloyd.com/repertoire/">Retour au site</a>
</nav>
<button class="hud btn" id="back" type="button" hidden>← retour à la feuille</button>
<div class="hud" id="hint">cliquez sur un genre</div>
<div id="card" hidden></div>

<script>
const PLAYS=[{"t": "À la fin, c'est Gandhi qui gagne", "u": "/repertoire/a-la-fin-c-est-gandhi-qui-gagne/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "10 comédiens (3 F, 7 H)", "du": "1h05", "y": 2019, "x": 0, "r": "Un enfant traité de « sale juif » dans la cour de récré, et des parents qui, pour l’aider, ressortent l’humour noir familial.", "e": ""}, {"t": "À trois pas du Ciel", "u": "/repertoire/a-trois-pas-du-ciel/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "2 comédiens (1 F, 1 H)", "du": "1h20", "y": 2015, "x": 0, "r": "La date de la fin du monde est connue : l’effondrement a été annoncé, et rien n’a été fait. Dans un bar en ruines, Noé, ancien communicant de l’industrie pétrolière qui a su et s’est tu, rencontre Andréa, ancienne militante écologiste qui a fini par renoncer. Peut-on encore tomber amoureux quand tout s’arrête ?", "e": ""}, {"t": "Au sein des creux", "u": "/repertoire/au-sein-des-creux/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "2 comédiennes", "du": "1h10", "y": 2009, "x": 0, "r": "Deux femmes, l’une seule, l’autre découvrant qu’elle l’est aussi, se croisent à six reprises sur plusieurs mois.", "e": ""}, {"t": "Avec panache", "u": "/repertoire/avec-panache/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "3 comédiens (1 F, 2 H)", "du": "1h15", "y": 2025, "x": 0, "r": "Roxane, travailleuse du sexe qui assume son métier, jongle entre ses clients et son frère schizophrène, Berlioz. La mort annoncée de sa mère et le retour de son père la précipitent, avec un client pris en otage, dans un road trip qui fait voler ses certitudes en éclats.", "e": ""}, {"t": "Babyfoot", "u": "/repertoire/babyfoot/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "4 comédiens", "du": "1h30", "y": 2014, "x": 1, "r": "Tom, Ben, Léo et Jo, inséparables ados, se retrouvent la quarantaine venue dans le bar de leur jeunesse. Une nuit de tempête, un vieux secret remonte, pour les diviser, ou les réunir.", "e": ""}, {"t": "Bon courage !", "u": "/repertoire/bon-courage/", "fam": "Comédie", "g": "Comédie sociale", "d": "7 comédiens", "du": "1h30", "y": 2025, "x": 1, "r": "Julien, cuisinier au chômage depuis quatre ans, débarque à France Travail avec ses couteaux pour prouver qu’il sait encore travailler. Un geste de trop, et le voilà pris pour un forcené.", "e": ""}, {"t": "C'est un beau roman…", "u": "/repertoire/c-est-un-beau-roman/", "fam": "Comédie", "g": "Comédie", "d": "2 comédiens (1 F, 1 H)", "du": "1h10", "y": 2014, "x": 0, "r": "Léo attend sa rencontre arrangée en insultant au téléphone la « baleine » qu’on lui présente, avant de découvrir que la baleine, c’est Anna, déjà face à lui.", "e": "Tertium Éditions"}, {"t": "Ce court instant de bonheur", "u": "/repertoire/ce-court-instant-de-bonheur/", "fam": "Comédie romantique", "g": "Comédie romantique", "d": "4 comédiens (2 F, 2 H)", "du": "1h10", "y": 2001, "x": 0, "r": "Nico et Laura cherchent chacun de leur côté de quoi combler un vide ; Tom et Anne, leurs meilleurs amis, racontent et commentent leur histoire.", "e": ""}, {"t": "Ce qui effleure les femmes !", "u": "/repertoire/ce-qui-effleure-les-femmes/", "fam": "Comédie romantique", "g": "Comédie romantique", "d": "3 comédiennes", "du": "1h10", "y": 2006, "x": 0, "r": "Camille, Juliette et Sandrine, à trois moments de la vie amoureuse. Un fiancé infidèle, un Roméo trouvé par petite annonce, un enfant sans père : trois femmes qui s’épaulent, s’engueulent et se mettent à nu.", "e": ""}, {"t": "Comme on craque une allumette", "u": "/repertoire/comme-on-craque-une-allumette/", "fam": "Comédie", "g": "Comédie", "d": "4 comédiens (2 F, 2 H)", "du": "1h", "y": 2006, "x": 0, "r": "Léandre, qui vient de rater son suicide sans que personne ne le remarque, croise Mathilde, ivre et à la dérive elle aussi. Rencontre entre deux naufrages, un soir de réveillon.", "e": ""}, {"t": "Comme un arbre penché", "u": "/repertoire/comme-un-arbre-penche/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "3 comédiens (1 F, 2 H)", "du": "1h20", "y": 2013, "x": 0, "r": "Douze ans après une dispute, Louis retrouve Philippe, son ami d’enfance, sur un lit d’hôpital : enfermé dans un locked-in syndrome, il ne peut plus bouger qu’une paupière. Visite après visite, Louis se met à tout lui dire.", "e": "L’Avant-Scène Théâtre"}, {"t": "Comme un père", "u": "/repertoire/comme-un-pere/", "fam": "Comédie", "g": "Comédie", "d": "2 comédiens (1 F, 1 H)", "du": "1h20", "y": 2009, "x": 0, "r": "Philippe, cinquante ans, Dom Juan de canton et peintre sans talent, coule des jours tranquilles dans le Jura. Jusqu’à ce que débarque Louise, la fille qu’il a laissée au berceau vingt-cinq ans plus tôt, l’urne de sa mère sous le bras. Un orage les enferme ensemble pour la nuit.", "e": ""}, {"t": "D'un claquement de doigts", "u": "/repertoire/d-un-claquement-de-doigts/", "fam": "Drame & thriller", "g": "Drame", "d": "3 comédiens (2 F, 1 H)", "du": "1h20", "y": 2023, "x": 0, "r": "Anna, femme de pouvoir controversée, et Jeanne, électron libre et cynique, se lient d’amitié envers et contre tout. Une enquête mystérieuse sur qui est vraiment Jeanne, à travers les époques.", "e": ""}, {"t": "Dans l'ordre des choses", "u": "/repertoire/dans-l-ordre-des-choses/", "fam": "Comédie douce-amère", "g": "Comédie douce-amère", "d": "5 comédiens (2 F, 3 H)", "du": "1h30", "y": 2011, "x": 0, "r": "Camille règle ses comptes avec Paul dans le jardin d’une fête, verre de champagne à la main. Ce qu’on n’a jamais su se dire, enfin déversé, sans savoir si ça répare ou si ça enterre.", "e": ""}, {"t": "Dans le décor !", "u": "/repertoire/dans-le-decor/", "fam": "Comédie", "g": "Comédie satirique", "d": "12 comédiens (7 F, 5 H)", "du": "1h30", "y": 2002, "x": 0, "r": "Une équipe de comédiens vedettes se prépare, sous l’œil d’une journaliste, à monter sur scène : rivalités d’ego, fausse solidarité et vraie comédie de coulisses, filmées en direct.", "e": ""}, {"t": "De bonnes ondes", "u": "/repertoire/de-bonnes-ondes/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "4 comédiens (2 F, 2 H)", "du": "1h15", "y": 2025, "x": 0, "r": "Nice, décembre 1999 : Sacha, animatrice radio, doit liquider en une nuit l’héritage de sa mère alcoolique tout juste morte, pendant qu’un frère bipolaire, un ex peu fiable et une fille longtemps délaissée débarquent sous la tempête. La vraie fin du monde, c’est peut-être celle qu’on porte en soi.", "e": ""}, {"t": "De folles promesses", "u": "/repertoire/de-folles-promesses/", "fam": "Comédie douce-amère", "g": "Comédie douce-amère", "d": "4 comédiens (1 F, 3 H)", "du": "1h10", "y": 2019, "x": 0, "r": "Granville, un soir d’été, dans un jardin au bord de la falaise. Roland, Noémie et Marc, les comédiens de toujours de Stéphan, ont rendez-vous avec lui pour une dernière mise en scène réglée à la minute près : le coucher du soleil, et peut-être enfin le rayon vert.", "e": ""}, {"t": "De la petite couture", "u": "/repertoire/de-la-petite-couture/", "fam": "Autres formes", "g": "Pièce musicale", "d": "1 comédienne", "du": "1h05", "y": 2023, "x": 0, "r": "Lou raconte sa vie au piano : une mère qui exige le silence, un homme qui cogne et qui trompe, et Denis, le surnom qu’elle donne à sa tumeur.", "e": ""}, {"t": "De la place pour deux", "u": "/repertoire/de-la-place-pour-deux/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "2 comédiens (1 F, 1 H)", "du": "1h20", "y": 2024, "x": 1, "r": "Léandre, schizophrène évadé de l’hôpital psychiatrique, retrouve sa demi-sœur Lucie. Tom, son ami imaginaire, prend chair sur scène.", "e": ""}, {"t": "Des Accordés", "u": "/repertoire/des-accordes/", "fam": "Comédie romantique", "g": "Comédie romantique", "d": "2 comédiens (1 F, 1 H)", "du": "1h10", "y": 2010, "x": 0, "r": "Dans un couloir de métro, Sam, qui vit à la rue, bute toujours sur le même accord de sa vieille guitare. Louis, un inconnu survolté, lui prend l’instrument, passe le do majeur e ", "e": ""}, {"t": "La vie est une fête !", "u": "/repertoire/la-vie-est-une-fete/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "5 comédiens", "du": "1h30", "y": 2019, "x": 0, "r": "Romain est né un 1er janvier : chaque réveillon est aussi son anniversaire. Nuit du Nouvel An 2019, il raconte sa vie de réveillon en réveillon, entre une mère qui voulait une fille, un père pour qui « pleurer, c’est pour les pédés » et l’Histoire de France qui passe à la télé.", "e": "L’Avant-Scène Théâtre"}, {"t": "Lavage délicat", "u": "/repertoire/lavage-delicat/", "fam": "Comédie douce-amère", "g": "Comédie douce-amère", "d": "2 comédiens (1 F, 1 H)", "du": "1h10", "y": 2004, "x": 0, "r": "Lou et Elliot remontent, en flash-back, le fil d’une histoire d’amour qu’on devine déjà abîmée.", "e": "Éclats d’encre"}, {"t": "Le Chut de l'histoire", "u": "/repertoire/le-chut-de-l-histoire/", "fam": "Fable", "g": "Fable", "d": "5 comédiens (3 F, 2 H)", "du": "1h30", "y": 2016, "x": 0, "r": "Cinq personnages atterrissent sur un plateau couvert de cartons, une sorcière, une princesse, une indécise, un poète réduit au mime et un brouillon qui ne dit que « Hmmm ». On les a convoqués sans texte. Pour ne pas s’effacer, ils partent à la chasse au premier mot.", "e": ""}, {"t": "Le Conte de Camille", "u": "/repertoire/le-conte-de-camille/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "4 comédiens (3 F, 1 H)", "du": "1h30", "y": 2002, "x": 0, "r": "Camille invente, pour l’enfant qu’elle garde, des contes de princesse qui racontent surtout sa propre vie amoureuse. Le babysitting comme diversion, et comme confession.", "e": "Éclats d’encre"}, {"t": "Le Dernier Mot", "u": "/repertoire/le-dernier-mot/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "6 comédiens (3 F, 3 H)", "du": "1h15", "y": 2022, "x": 0, "r": "Avant de sombrer dans le coma, le patriarche des Dumont lâche un aveu à sa femme : il l’a trompée. Sans autre explication.", "e": ""}, {"t": "Le Kl gué par Lily se raconte la nuit où il a tout perdu, entre facéties de cabaret et petites vengeances imaginaires.", "e": ""}, {"t": "Les yeux fermés", "u": "/repertoire/les-yeux-fermes/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "1 comédien", "du": "1h10", "y": 2026, "x": 1, "r": "Antoine, 42 ans, loser attachant, garde pour une semaine l’appartement de Marc, son meilleur ami depuis trente ans, et sa chatte Nina. Il tombe sur quelque chose qu’il n’aurait jamais dû voir. Peut-on être quelqu’un de bien quand on a les yeux fermés ?", "e": ""}, {"t": "M'en fous la Mort !", "u": "/repertoire/m-en-fous-la-mort/", "fam": "Fable", "g": "Fable", "d": "4 comédiens (1 F, 1 H, 2 au choix)", "du": "1h15", "y": 2006, "x": 0, "r": "Un soir, la Mort tombe en panne de voiture et se retrouve coincée dans un grenier avec trois orphelins qui la connaissent très bien. Pour passer le temps, ils lui font jouer les textes de leur père, retrouvés dans une vieille malle.", "e": ""}, {"t": "Même pas en rêves", "u": "/repertoire/meme-pas-en-reves/", "fam": "Drame & thriller", "g": "Drame", "d": "4 comédiens (2 F, 2 H)", "du": "1h30", "y": 2009, "x": 0, "r": "Léandre, Gabrielle, Denis et Viviane, une bande de trentenaires en déshérence, se répètent que demain sera meilleur qu’aujourd’hui sans y croire tout à fait.", "e": ""}, {"t": "Nationale 666 (The Highway to Elle)", "u": "/repertoire/nationale-666-the-highway-to-elle/", "fam": "Comédie", "g": "Road trip", "d": "3 comédiennes", "du": "1h30", "y": 2002, "x": 0, "r": "Devant l’autel, Sophie prend la fuite, poussée par sa mauvaise conscience, Louise, et rattrapée par la bonne, Angélique. Direction New York… jusqu’à la panne, à Granville.", "e": "Éclats d’encre"}, {"t": "Ne cessez pas de rire !", "u": "/repertoire/ne-cessez-pas-de-rire/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "4 comédiennes", "du": "1h20", "y": 2013, "x": 0, "r": "Un 31 décembre, sur une plage du Pays basque, quatre amies de trente ans se retrouvent pour dire adieu à la cinquième, Charlotte, qui a choisi de ne pas être là. Son absence va révéler des mensonges et mettre leur amitié à rude épreuve.", "e": ""}, {"t": "(On a tout mis) Dans le décor", "u": "/repertoire/on-a-tout-mis-dans-le-decor/", "fam": "Comédie", "g": "Commedia dell'arte", "d": "9 comédiens (4 F, 5 H)", "du": "1h15", "y": 2012, "x": 0, "r": "Venise, un maire corrompu démissionne : Pantalon, sous la pression de sa femme avide de pouvoir, se lance dans la course contre le fanfaron Matamore, pendant qu’Arlequin et Polichinelle changent de maître au gré du vent.", "e": ""}, {"t": "On s'ennuiera plus tard", "u": "/repertoire/on-s-ennuiera-plus-tard/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "3 comédiens (1 F, 2 H)", "du": "1h10", "y": 2023, "x": 0, "r": "Chaque soir, Clément dresse le couvert d’Odette et lui fait la conversation, même si elle est morte depuis quelques années. Mais aujourd’hui, les souvenirs débordent sur le présent, et leurs doubles de vingt ans s’invitent à table.", "e": ""}, {"t": "One Moi Show", "u": "/repertoire/one-moi-show/", "fam": "Seul-en-scène", "g": "Seul-en-scène à sketches", "d": "1 comédien", "du": "1h15", "y": 2004, "x": 0, "r": "Un homme seul en scène jure qu’il n’est pas drôle et passe le spectacle à le prouver : célibat revendiqué, bébé refusé, serial killer qui ne tue que ce qui l’énerve, et provocations assumées jusqu’au mauvais goût.", "e": ""}, {"t": "Pile et Face", "u": "/repertoire/pile-et-face/", "fam": "Comédie romantique", "g": "Comédie romantique", "d": "2 comédiens (1 F, 1 H)", "du": "1h10", "y": 2006, "x": 0, "r": "Incapable de trancher quoi que ce soit sans l’aide d’une pièce de monnaie héritée de son père, Will s’apprête enfin à avouer son amour à Natacha, le soir même où elle vient lui annoncer son propre mariage.", "e": ""}, {"t": "Portrait avec retouches", "u": "/repertoire/portrait-avec-retouches/", "fam": "Drame & thriller", "g": "Biographie (Françoise Giroud)", "d": "6 comédiens (3 F, 3 H)", "du": "1h30", "y": 2026, "x": 1, "r": "Mars 1977. Accusée par un sénateur de porter illégalement la médaille de la Résistance, Françoise Giroud a une semaine pour répondre, en direct à la télévision. Sur le divan de Lacan, elle rouvre enfin le seul dossier qu’elle n’a jamais instruit : le sien.", "e": ""}, {"t": "Presque Elle", "u": "/repertoire/presque-elle/", "fam": "Drame & thriller", "g": "Drame d'anticipation", "d": "7 comédiens (3 F, 4 H)", "du": "1h30", "y": 2024, "x": 0, "r": "Dans un futur incertain, l’apiculteur veuf Gabriel voit resurgir Jodie, sa femme morte depuis dix ans, bien vivante et intacte de mémoire : miracle pour les uns, manipulation scientifique pour les autres.", "e": ""}, {"t": "Puisque vous partez en voyage", "u": "/repertoire/puisque-vous-partez-en-voyage/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "4 comédiens (2 F, 2 H)", "du": "1h30", "y": 2024, "x": 0, "r": "Deux ans que Jacques, 75 ans, fait la lecture à sa femme sur sa tombe, Françoise Hardy en fond sonore. Un dimanche, une inconnue déplie sa chaise à côté de la sienne, chante le refrain et salue la défunte d’un « Bonjour, Maman ». Jacques, qui avait prévu de couper l’électricité la semaine suivante, va devoir revoir son planning.", "e": ""}, {"t": "Rayon grand déballage", "u": "/repertoire/rayon-grand-deballage/", "fam": "Comédie douce-amère", "g": "Comédie douce-amère", "d": "2 comédiennes", "du": "1h15", "y": 2009, "x": 0, "r": "Une nuit, enfermées dans un grand magasin. Élise, patronne claustrophobe noyée dans le whisky, et Sandrine, mère de famille venue là exprès, en pèlerinage, qui la gifle par réflexe. Jusqu’à l’ouverture, entre le rayon chaussures et le rayon literie, elles se déballent tout.", "e": ""}, {"t": "Rêves Party", "u": "/repertoire/reves-party/", "fam": "Saynètes & recueils", "g": "Pièce à tableaux pour adolescents", "d": "distribution modulable", "du": "1h15", "y": 2017, "x": 0, "r": "Dans une soirée d’adolescents où l’on danse, fume et se cherche, Mathilde et Léandre se croisent au hasard d’une cigarette qui refuse de s’allumer.", "e": ""}, {"t": "Si tu me quittes, je viens avec toi", "u": "/repertoire/si-tu-me-quittes-je-viens-avec-toi/", "fam": "Saynètes & recueils", "g": "Comédie à saynètes", "d": "distribution modulable", "du": "1h20", "y": 2014, "x": 0, "r": "Comédie à sketches qui passe en revue toutes les manières de rompre (avec son homme, sa mère ou ses propres espoirs) jouées par une troupe qui échange les rôles, hommes et femmes compris.", "e": ""}, {"t": "Spoiler", "u": "/repertoire/spoiler/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "4 comédiens (2 F, 2 H)", "du": "1h20", "y": 2026, "x": 1, "r": "Depuis ses huit ans, Antoine vit flanqué de Gérard, un spoiler invisible qui lui révèle toujours la fin, si bien qu’il n’a jamais rien commencé. Jusqu’au jour où Lina, venue déclarer une urne funéraire égarée, rend Gérard muet pour la première fois.", "e": ""}, {"t": "Suivant les pointillés", "u": "/repertoire/suivant-les-pointilles/", "fam": "Comédie dramatique", "g": "Comédie dramatique", "d": "4 comédiens (2 F, 2 H)", "du": "1h30", "y": 2020, "x": 0, "r": "À Harlem, Clive, boxeur sur le déclin sorti de prison, et Rosie, tout juste acquittée d’avoir tué son mari violent, tentent de se réparer l’un l’autre sans rien se dire de leur passé.", "e": ""}, {"t": "Suivez mon âme", "u": "/repertoire/suivez-mon-ame/", "fam": "Seul-en-scène", "g": "Seul-en-scène", "d": "1 comédien", "du": "1h", "y": 2017, "x": 0, "r": "Antoine, bientôt cinquante ans, dort encore dans son lit d’adolescent. Flanqué de Cyrano, son ami imaginaire, il raconte sa vie à une seule personne du public, et décide enfin d’enlever les petites roues du vélo.", "e": ""}, {"t": "Sur l'échelle de Glasgow", "u": "/repertoire/sur-l-echelle-de-glasgow/", "fam": "Drame & thriller", "g": "Drame poétique", "d": "6 comédiens (3 F, 2 H, 1 au choix)", "du": "1h30", "y": 2015, "x": 0, "r": "Théo se réveille sous un abri, sous la pluie, dans un coma partagé avec d’autres. Sam et Calvin lui expliquent la règle : 11 sur l’échelle de Glasgow, et pour remonter, il faut aimer et se faire aimer. Et La Mort rôde, plan à la main.", "e": ""}, {"t": "Terrienne", "u": "/repertoire/terrienne/", "fam": "Seul-en-scène", "g": "Seule-en-scène", "d": "1 comédienne", "du": "1h10", "y": 2009, "x": 0, "r": "Au lendemain de l’enterrement de son père, Anna, sculptrice de trente-cinq ans, ne parvient pas à pleurer. Entre une mère caustique, un frère qui pleure pour deux, un compagnon patient et le fantôme narquois du défunt, elle découvre des centaines de lettres jamais envoyées à un certain « M. Weber » et part frapper à sa porte.", "e": ""}, {"t": "This is not America", "u": "/repertoire/this-is-not-america/", "fam": "Drame & thriller", "g": "Drame", "d": "4 comédiens (2 F, 2 H)", "du": "1h30", "y": 2018, "x": 0, "r": "Travis, vétéran hanté par des guerres sans début ni armistice, se retrouve dans le parloir délabré d’un commissariat face à Gabby.", "e": ""}, {"t": "Tout pareil, ou presque", "u": "/repertoire/tout-pareil-ou-presque/", "fam": "Comédie douce-amère", "g": "Road movie", "d": "4 comédiens (1 F, 3 H)", "du": "1h20", "y": 2020, "x": 0, "r": "Trente ans après se l’être promis, Jérôme, Rémi et Lucas rejouent, dans les mêmes conditions, un voyage du Pays basque à la pointe de la Hague, sauf que la géographie a changé, et eux aussi.", "e": ""}, {"t": "Tripalium", "u": "/repertoire/tripalium/", "fam": "Comédie", "g": "Comédie sociale", "d": "8 comédiens (4 F, 4 H)", "du": "1h30", "y": 2011, "x": 0, "r": "Une équipe de télé filme la résistance improbable des salariés d’une PME menacée de délocalisation, entre lutte sociale et amours de bureau maladroites.", "e": ""}, {"t": "Trois petits points de fuite (Histoire d'âmes II)", "u": "/repertoire/trois-petits-points-de-fuite-histoire-d-ames-ii/", "fam": "Saynètes & recueils", "g": "Comédie à saynètes", "d": "distribution modulable", "du": "1h30", "y": 2009, "x": 0, "r": "Un immeuble, un mois, une porte par scène : derrière chacune, un couple se quitte, se retient ou se rate. Entre deux ruptures, Emmy, qui refuse son nom de famille et laisse toutes ses phrases en suspens, suit dans les couloirs le voisin à qui elle n’ose pas dire bonjour.", "e": ""}, {"t": "Un cadavre exquis", "u": "/repertoire/un-cadavre-exquis/", "fam": "Comédie douce-amère", "g": "Comédie douce-amère", "d": "7 comédiens (3 F, 4 H)", "du": "1h40", "y": 2007, "x": 0, "r": "En Angleterre, Armando, metteur en scène génial à ses propres yeux, monte le spectacle de sa vie sur la mort, avec un atout que personne n’a jamais osé : Andrew, malade en phase terminale, engagé pour mourir en scène le soir de la première. Mais la troupe s’attache à lui, et Andrew se remet à vivre.", "e": ""}, {"t": "Un Chœur qui Bat", "u": "/repertoire/un-choeur-qui-bat/", "fam": "Comédie", "g": "Comédie", "d": "distribution modulable", "du": "1h40", "y": 2024, "x": 0, "r": "Un chœur antique, façon tragédie grecque, commente et orchestre en direct la vie amoureuse d’Alizé, jeune femme de 25 ans qui n’a encore jamais embrassé personne.", "e": ""}, {"t": "Un drôle d'héritage", "u": "/repertoire/un-drole-d-heritage/", "fam": "Comédie", "g": "Comédie", "d": "6 comédiens (4 F, 2 H)", "du": "1h20", "y": 2015, "x": 0, "r": "En vidant la maison de Pépé, fraîchement décédé, Rose tombe sur un uniforme allemand et des lettres de délation. Entre un frère schizophrène, une mère toxique, des tantes gratinées et Floyd, pour qui elle a un gros béguin, ses douze travaux commencent.", "e": ""}, {"t": "Un gramme de lumière", "u": "/repertoire/un-gramme-de-lumiere/", "fam": "Drame & thriller", "g": "Drame, thriller", "d": "2 comédiens", "du": "1h15", "y": 2012, "x": 0, "r": "Au parloir d’une prison, Alfred, jeune avocat commis d’office, cherche à comprendre pourquoi Harvey Pierce a tenté de s’évader à quelques jours de sa libération.", "e": ""}, {"t": "Un souffle au cœur", "u function clampCam(c){const vw=innerWidth,vh=innerHeight,bw=W*c.s,bh=H*c.s;c.x=bw<=vw?(vw-bw)/2:Math.min(0,Math.max(vw-bw,c.x));c.y=bh<=vh?(vh-bh)/2:Math.min(0,Math.max(vh-bh,c.y));return c}
function setView(s,cx,cy){target.s=Math.max(zmin(),Math.min(ZMAX,s));target.x=innerWidth/2-cx*target.s;target.y=(TOP()+innerHeight-BOT())/2-cy*target.s;clampCam(target)}
function zoomAt(f,sx,sy){const wx=(sx-target.x)/target.s,wy=(sy-target.y)/target.s;target.s=Math.max(zmin(),Math.min(ZMAX,target.s*f));target.x=sx-wx*target.s;target.y=sy-wy*target.s;clampCam(target);syncMode()}
function overviewScale(){return Math.max(fitScale(),Math.min(coverScale(),(innerHeight-TOP()-BOT())/1560,(innerWidth-24)/2120))}
function overview(){mode='overview';document.body.classList.add('ov');openName=null;card.hidden=true;unfocus();document.querySelectorAll('.cell').forEach(c=>c.classList.add('ov'));setView(overviewScale(),1580,990);$('back').hidden=true;$('hint').textContent=coarse?'touchez un genre':'cliquez sur un genre';$('hint').hidden=false;
  document.querySelectorAll('.li').forEach(a=>a.tabIndex=-1);}
function openCell(name){const c=cells[name];mode='cell';document.body.classList.remove('ov');openName=name;card.hidden=true;unfocus();
  const s=Math.min((innerWidth-40)/(c.w+60),(innerHeight-TOP()-BOT()-20)/(c.h+40));setView(s,c.x+c.w/2,c.y+c.h/2);
  document.querySelectorAll('.cell').forEach(x=>x.classList.remove('ov'));c.el.classList.add('open');$('back').hidden=false;$('hint').textContent=coarse?'touchez un titre':'survolez un titre, cliquez pour sa fiche';
  c.el.querySelectorAll('.li').forEach(a=>a.tabIndex=0);}
function syncMode(){if(mode==='cell'&&target.s<overviewScale()*1.15){mode='overview';document.body.classList.add('ov');document.querySelectorAll('.cell').forEach(c=>c.classList.add('ov'));$('back').hidden=true}else if(mode==='overview'&&target.s>overviewScale()*1.6){mode='free';document.body.classList.remove('ov');document.querySelectorAll('.cell').forEach(x=>{x.classList.remove('ov');x.classList.add('open')});$('back').hidden=false}}
$('back').addEventListener('click',overview);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let dragging=false,moved=0,last=null,pinch=null,vel={x:0,y:0},lastTr='';const pts=new Map();
function tick(){if(!dragging&&(Math.abs(vel.x)+Math.abs(vel.y))>.3){target.x+=vel.x;target.y+=vel.y;vel.x*=.92;vel.y*=.92;clampCam(target)}
  const k=reduce?1:.14;cam.x+=(target.x-cam.x)*k;cam.y+=(target.y-cam.y)*k;cam.s+=(target.s-cam.s)*k;
  const tr=`translate(${cam.x.toFixed(1)}px,${cam.y.toFixed(1)}px) scale(${cam.s.toFixed(4)})`;if(tr!==lastTr){board.style.transform=tr;lastTr=tr}requestAnimationFrame(tick)}
stage.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}}dragging=true;moved=0;vel={x:0,y:0};last={x:e.clientX,y:e.clientY,t:performance.now()};stage.classList.add('drag');
  if(coarse&&!e.target.closest('.li')){card.hidden=true;unfocus()}});
addEventListener('pointermove',e=>{if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);pinch.d=d;moved+=10;return}
  if(dragging&&last){const dx=e.clientX-last.x,dy=e.clientY-last.y,now=performance.now(),dt=Math.max(8,now-last.t);moved+=Math.abs(dx)+Math.abs(dy);target.x+=dx;target.y+=dy;clampCam(target);cam.x+=dx;cam.y+=dy;vel={x:dx/dt*16,y:dy/dt*16};last={x:e.clientX,y:e.clientY,t:now};if(moved>6)card.hidden=true;}});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){dragging=false;stage.classList.remove('drag');if(performance.now()-(last?.t||0)>80)vel={x:0,y:0}}};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();card.hidden=true;if(e.ctrlKey||e.metaKey||(!e.deltaX&&e.deltaMode!==0)||(!e.deltaX&&Math.abs(e.deltaY)>=40))zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0022)),e.clientX,e.clientY);else{target.x-=e.deltaX;target.y-=e.deltaY;clampCam(target)}},{passive:false});
stage.addEventListener('click',e=>{const a=e.target.closest('.li');if(!a)return;if(moved>6||mode==='overview'){e.preventDefault();return}
  if(coarse){const o=byTitle[a.dataset.t];if(card.hidden||card.dataset.t!==a.dataset.t){e.preventDefault();focusOn(a.dataset.t);showCard(o);card.dataset.t=a.dataset.t;}}});
stage.addEventListener('pointerover',e=>{if(coarse||dragging||mode==='overview')return;const a=e.target.closest('.li');if(!a)return;clearTimeout(hideT);focusOn(a.dataset.t);showCard(byTitle[a.dataset.t]);});
stage.addEventListener('pointerout',e=>{if(coarse)return;const a=e.target.closest('.li');if(!a||(e.relatedTarget&&a.contains(e.relatedTarget)))return;hideCard()});
stage.addEventListener('focusin',e=>{const a=e.target.closest('.li');if(!a)return;focusOn(a.dataset.t);setTimeout(()=>showCard(byTitle[a.dataset.t]),100)});
stage.addEventListener('focusout',()=>{card.hidden=true;unfocus()});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!card.hidden){card.hidden=true;unfocus()}else overview()}});
addEventListener('resize',()=>{if(mode==='cell')openCell(openName);else if(mode==='overview')overview();else clampCam(target)});

/* téléphone */
function buildMobile(){const sh=$('sheet');const fams={};PLAYS.forEach(p=>(fams[p.fam]=fams[p.fam]||[]).push(p));let ni=3;
  CELLS.forEach(([name,,,,,col])=>{const list=(fams[name]||[]).slice().sort((a,b)=>a.t.localeCompare(b.t,'fr'));
    const grp=document.createElement('div');grp.className='grp';grp.style.setProperty('--c',`var(${col})`);
    const b=document.createElement('button');b.type='button';b.className='g';b.setAttribute('aria-expanded','false');b.style.setProperty('--r',rr(-1.6,1.2).toFixed(1)+'deg');b.style.setProperty('--u',rr(45,80).toFixed(0)+'%');
    b.textContent=name.toLowerCase();const sm=document.createElement('small');sm.textContent='('+list.length+')';b.appendChild(sm);grp.appendChild(b);
    const ul=document.createElement('div');ul.className='lst';
    list.forEach((p,i)=>{const a=document.createElement('a');a.href=SITE+p.u;a.className=p.x?'x':'';a.textContent=p.t;a.style.setProperty('--r',rr(-1.2,1).toFixed(1)+'deg');
      if(p.x){const s=document.createElement('span');s.className='nd';s.textContent='non dispo';a.appendChild(s)}
      a.addEventListener('click',e=>{e.preventDefault();if(!card.hidden&&card.dataset.t===p.t){location.href=a.href;return}showCard({p,el:a});card.dataset.t=p.t});ul.appendChild(a);
      if(i===Math.floor(list.length/2)&&list.length>3&&rnd()<.6){const n=document.createElement('div');n.className='nt2';n.textContent=NOTES[ni++%NOTES.length];ul.appendChild(n)}});
    grp.appendChild(ul);b.addEventListener('click',()=>{const o=grp.classList.toggle('open');b.setAttribute('aria-expanded',o);card.hidden=true;});sh.appendChild(grp);});
  $('mob').addEventListener('scroll',()=>{card.hidden=true},{passive:true});
  $('mob').addEventListener('click',e=>{if(!e.target.closest('a'))card.hidden=true});}
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{build();buildMobile();overview();Object.assign(cam,target);cam.s=target.s*.96;requestAnimationFrame(tick)});
</script>
